<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-zahl-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #444f4f;
        }
        .s6-ch,
        .s6-w {
          display: inline-block;
        }
        .s6-lpos {
          position: absolute;
          transform: translate(-50%, -50%);
        }
        .s6-name {
          display: block;
          white-space: nowrap;
          font-size: 30px;
          font-weight: 500;
          line-height: 1.15;
          color: #5e6a6a;
        }
        .s6-zahl {
          position: absolute;
          left: 0;
          right: 0;
          top: 176px;
          text-align: center;
          font-size: 270px;
          font-weight: 900;
          letter-spacing: -0.05em;
          line-height: 1;
          color: #ca2c35;
        }
        .s6-label {
          position: absolute;
          left: 40px;
          right: 40px;
          top: 452px;
          text-align: center;
          font-size: 62px;
          font-weight: 900;
          letter-spacing: -0.03em;
          line-height: 1.05;
        }
        /* Zahlenrad (Registry: number-wheel) */
        .hf-number-wheel {
          display: inline-flex;
          align-items: baseline;
          gap: 0.02em;
          font-variant-numeric: tabular-nums;
        }
        .hf-number-wheel-digit {
          display: inline-block;
          height: 1em;
          overflow: hidden;
        }
        .hf-number-wheel-strip {
          display: grid;
        }
        .hf-number-wheel-strip span {
          height: 1em;
          line-height: 1em;
        }
      </style>
      <div id="root" data-composition-id="s6-zahl" data-width="1080" data-height="1920" data-duration="2.8">
        <div class="s6-zahl" id="s6-zahl"><span class="hf-number-wheel" id="s6-rad" data-value="19" data-layout-ignore></span></div>
        <div class="s6-label" id="s6-label"><span class="s6-w" id="s6-l0w0">Städte</span> <span class="s6-w" id="s6-l0w1">und</span> <span class="s6-w" id="s6-l0w2">Gemeinden</span></div>
      </div>
      <script>
        (function () {
          document.querySelectorAll("#s6-rad").forEach((el) => {
            if (el.dataset.ready === "1") return;
            const value = el.dataset.value || "0";
            el.textContent = "";
            for (const ch of value) {
              const stops = 10 + Number(ch);
              const frame = document.createElement("span");
              frame.className = "hf-number-wheel-digit";
              const strip = document.createElement("span");
              strip.className = "hf-number-wheel-strip";
              strip.dataset.stops = String(stops);
              for (let i = 0; i <= stops; i++) {
                const step = document.createElement("span");
                step.textContent = String(i % 10);
                strip.appendChild(step);
              }
              frame.appendChild(strip);
              el.appendChild(frame);
            }
            el.dataset.ready = "1";
          });
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-zahl", { opacity: 0, scale: 0.86, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, 0.55);
          tl.fromTo("#s6-rad .hf-number-wheel-strip", { y: 0 }, { y: (i, el) => -Number(el.dataset.stops) + "em", duration: 1.2, ease: "power3.out", stagger: 0.08 }, 0.55);
          tl.fromTo("#s6-l0w0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 0.90);
          tl.fromTo("#s6-l0w1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 0.98);
          tl.fromTo("#s6-l0w2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, 1.06);
          tl.to(["#s6-zahl", "#s6-label"], { opacity: 0, filter: "blur(12px)", duration: 0.18, ease: "power2.in" }, 2.58);
          window.__timelines["s6-zahl"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
