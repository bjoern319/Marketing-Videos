<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="street-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #2a3737;
          font-family: "Lato", sans-serif;
        }
        .st-layer {
          position: absolute;
          left: 0;
          top: 0;
          transform-origin: 0 0;
        }
        #st-clouds {
          width: 4200px;
          height: 420px;
        }
        #st-world {
          width: 6000px;
          height: 1080px;
        }
        .st-svg {
          display: block;
          overflow: visible;
        }
        /* drawing language */
        .st-o {
          stroke: #2a3737;
          stroke-width: 5;
          stroke-linejoin: round;
          stroke-linecap: round;
        }
        .st-pot-el {
          fill: none;
          stroke: #6ba221;
          stroke-width: 6;
          stroke-dasharray: 16 11;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        /* screen-space UI */
        .st-head {
          position: absolute;
          left: 120px;
          top: 230px;
          font-family: "Lato", sans-serif;
          font-weight: 700;
          font-size: 112px;
          line-height: 1.05;
          letter-spacing: -0.015em;
          white-space: nowrap;
          transform-origin: 0 0;
        }
        .st-head-line {
          display: block;
          overflow: hidden;
          padding-bottom: 16px;
          margin-bottom: -16px;
        }
        .st-hw {
          display: inline-block;
          margin-right: 0.22em;
        }
        .st-label {
          position: absolute;
          left: 122px;
          top: 62px;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #5e742e;
        }
        .st-count {
          position: absolute;
          right: 120px;
          top: 60px;
          width: 260px;
          height: 110px;
        }
        .st-count-num {
          position: absolute;
          right: 0;
          top: 0;
          font-weight: 700;
          font-size: 40px;
          letter-spacing: 0.04em;
          font-variant-numeric: tabular-nums;
          color: #2a3737;
          white-space: nowrap;
        }
        .st-count-num span {
          color: #5a6462;
          font-weight: 700;
        }
        .st-segs {
          position: absolute;
          right: 0;
          top: 66px;
          display: flex;
          gap: 8px;
        }
        .st-seg {
          position: relative;
          display: block;
          width: 42px;
          height: 7px;
          border-radius: 4px;
          background: #dadcd0;
          overflow: hidden;
        }
        .st-seg-fill {
          position: absolute;
          inset: 0;
          display: block;
          background: #6ba221;
          transform-origin: 0 50%;
        }
        .st-card {
          position: absolute;
          left: 340px;
          top: 186px;
          width: 1240px;
          height: 186px;
          display: flex;
          align-items: center;
          gap: 34px;
          padding: 0 44px;
          border: 3px solid #dee3db;
          border-radius: 26px;
          background: #fcfcfc;
          box-shadow: 0 24px 50px rgba(42, 55, 55, 0.14);
          transform-origin: 50% 118%;
        }
        .st-card::after {
          content: "";
          position: absolute;
          left: 50%;
          bottom: -19px;
          width: 32px;
          height: 32px;
          margin-left: -16px;
          background: #fcfcfc;
          border-right: 3px solid #dee3db;
          border-bottom: 3px solid #dee3db;
          transform: rotate(45deg);
        }
        .st-badge {
          display: flex;
          align-items: center;
          justify-content: center;
          flex: 0 0 auto;
          width: 84px;
          height: 84px;
          border-radius: 50%;
          background: #5e742e;
          color: #fcfcfc;
          font-family: "Lato", sans-serif;
          font-weight: 900;
          font-size: 32px;
        }
        .st-card-text {
          display: flex;
          flex-direction: column;
          gap: 6px;
          min-width: 0;
        }
        .st-card-title {
          font-family: "Lato", sans-serif;
          font-weight: 700;
          font-size: 52px;
          line-height: 1.05;
          letter-spacing: -0.01em;
          white-space: nowrap;
        }
        .st-card-desc {
          font-weight: 400;
          font-size: 30px;
          line-height: 1.2;
          color: #5a6462;
          white-space: nowrap;
        }
        .st-peak {
          position: absolute;
          left: 120px;
          top: 150px;
          font-family: "Lato", sans-serif;
          font-weight: 700;
          font-size: 116px;
          line-height: 1.04;
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .st-peak-line {
          display: block;
          overflow: hidden;
          padding-bottom: 18px;
          margin-bottom: -18px;
        }
        .st-pw {
          display: inline-block;
          margin-right: 0.22em;
        }
        .st-peak-accent {
          color: #5e742e;
        }
        .st-peak-sub {
          position: absolute;
          left: 124px;
          top: 432px;
          font-weight: 700;
          font-size: 36px;
          color: #5a6462;
          white-space: nowrap;
        }
        #st-sparkles {
          position: absolute;
          inset: 0;
        }
        .st-spark {
          position: absolute;
          display: block;
          width: 34px;
          height: 34px;
          margin: -17px 0 0 -17px;
        }
      </style>

      <div id="root" data-composition-id="street" data-width="1920" data-height="1080">
        <div class="st-layer" id="st-clouds"><svg class="st-svg" id="st-clouds-svg" width="4200" height="420" viewBox="0 0 4200 420"></svg></div>
        <div class="st-layer" id="st-world"><svg class="st-svg" id="st-world-svg" width="6000" height="1080" viewBox="0 0 6000 1080"></svg></div>

        <div id="st-sparkles"></div>

        <div class="st-label" id="st-label">Potenziale in unserer Stadt</div>
        <div class="st-head" id="st-head">
          <span class="st-head-line"><span class="st-hw">Drei</span><span class="st-hw">Wege</span><span class="st-hw">zu</span><span class="st-hw">mehr</span><span class="st-hw">Wohnraum</span></span>
        </div>

        <div class="st-count" id="st-count">
          <div class="st-count-num st-cn" id="st-cn-1">01 <span>/ 03</span></div>
          <div class="st-count-num st-cn" id="st-cn-2">02 <span>/ 03</span></div>
          <div class="st-count-num st-cn" id="st-cn-3">03 <span>/ 03</span></div>
          <div class="st-segs">
            <span class="st-seg"><span class="st-seg-fill" id="st-seg-1"></span></span>
            <span class="st-seg"><span class="st-seg-fill" id="st-seg-2"></span></span>
            <span class="st-seg"><span class="st-seg-fill" id="st-seg-3"></span></span>
          </div>
        </div>

        <div class="st-card" id="st-card-1">
          <div class="st-badge">01</div>
          <div class="st-card-text">
            <div class="st-card-title">Bestehenden Wohnraum besser nutzen</div>
            <div class="st-card-desc">z. B. aus einem Einfamilienhaus ein Vierfamilienhaus</div>
          </div>
        </div>
        <div class="st-card" id="st-card-2">
          <div class="st-badge">02</div>
          <div class="st-card-text">
            <div class="st-card-title">Leerstehende Gewerbeflächen umnutzen</div>
            <div class="st-card-desc">Wo eine bisherige Nutzung endet, kann Wohnraum entstehen</div>
          </div>
        </div>
        <div class="st-card" id="st-card-3">
          <div class="st-badge">03</div>
          <div class="st-card-text">
            <div class="st-card-title">Baulücken aktivieren</div>
            <div class="st-card-desc">Anbau, zweites Haus oder Brachfläche – möglichst flächenschonend</div>
          </div>
        </div>

        <div class="st-peak" id="st-peak">
          <span class="st-peak-line" data-layout-allow-overflow><span class="st-pw st-pw1">Aus</span><span class="st-pw st-pw1">ungenutztem</span><span class="st-pw st-pw1">Raum</span></span>
          <span class="st-peak-line" data-layout-allow-overflow><span class="st-pw st-pw2">wird</span><span class="st-pw st-pw2 st-peak-accent">Zuhause.</span></span>
        </div>
        <div class="st-peak-sub" id="st-peak-sub">Übergroße Häuser, leerstehendes Gewerbe, Baulücken – mitten in Bergisch Gladbach.</div>
      </div>

      <script>
        (function () {
          const GROUND = 930;
          const X = [960, 1960, 2960];
          const IDS = [1, 2, 4]; // station ids used in the drawing (1 = house, 2 = shop, 4 = gap)
          const C = {
            ink: "#2a3737",
            ink2: "#5a6462",
            wall: "#fdfdfb",
            wallOld: "#ddd5c1",
            side: "#edefe6",
            roof: "#4c4e48",
            dark: "#45473f",
            glow: "#f4b24e",
            green: "#6ba221",
            leaf: "#b7d493",
            leaf2: "#98c46a",
            terra: "#5e742e",
            walk: "#e7eadf",
            road: "#d9dccf",
            shutter: "#c2c5bc",
          };
          const O = 'class="st-o"';

          // ---------- helpers ----------
          const rect = (x, y, w, h, fill, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${extra}/>`;
          const win = (x, y, w, h, fill = C.dark) => rect(x, y, w, h, fill, `rx="5" ${O}`);
          const person = (cx, base, s = 1, fill = C.ink) =>
            `<g fill="${fill}"><circle cx="${cx}" cy="${base - 46 * s}" r="${10 * s}"/>` +
            `<path d="M${cx - 15 * s} ${base} V${base - 22 * s} Q${cx - 15 * s} ${base - 34 * s} ${cx} ${base - 34 * s} Q${cx + 15 * s} ${base - 34 * s} ${cx + 15 * s} ${base - 22 * s} V${base} Z"/></g>`;
          const potRect = (x, y, w, h) => `<rect class="st-pot-el" x="${x - 11}" y="${y - 11}" width="${w + 22}" height="${h + 22}" rx="10"/>`;
          const tree = (x, s = 1) =>
            `<g><rect x="${x - 11 * s}" y="${GROUND - 120 * s}" width="${22 * s}" height="${120 * s}" fill="#7a5a41" ${O}/>` +
            `<circle cx="${x}" cy="${GROUND - 175 * s}" r="${86 * s}" fill="${C.leaf}" ${O}/>` +
            `<circle cx="${x - 34 * s}" cy="${GROUND - 160 * s}" r="${30 * s}" fill="${C.leaf2}"/>` +
            `<circle cx="${x + 30 * s}" cy="${GROUND - 205 * s}" r="${22 * s}" fill="${C.leaf2}"/></g>`;
          const bush = (x, w = 120) =>
            `<path d="M${x - w / 2} ${GROUND} Q${x - w / 2} ${GROUND - 56} ${x - w / 6} ${GROUND - 50} Q${x} ${GROUND - 84} ${x + w / 6} ${GROUND - 52} Q${x + w / 2} ${GROUND - 60} ${x + w / 2} ${GROUND} Z" fill="${C.leaf2}" ${O}/>`;
          const lamp = (x) =>
            `<g><line x1="${x}" y1="${GROUND}" x2="${x}" y2="${GROUND - 300}" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/>` +
            `<path d="M${x} ${GROUND - 300} Q${x} ${GROUND - 330} ${x + 34} ${GROUND - 330}" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/>` +
            `<path d="M${x + 16} ${GROUND - 330} H${x + 62} L${x + 54} ${GROUND - 312} H${x + 24} Z" fill="${C.glow}" ${O}/></g>`;
          const plainHouse = (x, w, h, r) => {
            const t = GROUND - h;
            let s = `<path d="M${x - w / 2} ${GROUND} V${t} L${x} ${t - r} L${x + w / 2} ${t} V${GROUND} Z" fill="${C.side}" ${O}/>`;
            const cols = 2;
            for (let row = 0; row < 2; row++) {
              for (let c = 0; c < cols; c++) {
                const wx = x - w / 2 + 34 + c * (w - 68 - 70) / (cols - 1);
                s += win(wx, t + 30 + row * 100, 70, 66, (row + c) % 2 === 0 ? C.glow : C.dark);
              }
            }
            return s;
          };

          // ---------- station 1: large single-family home, mostly dark ----------
          function station1(x) {
            const L = x - 290;
            let s = `<g id="st-s1">`;
            s += rect(x + 150, 470, 42, 110, C.wallOld, O); // chimney
            s += rect(L, 610, 580, 320, C.wall, O);
            s += `<path d="M${x - 335} 612 L${x} 432 L${x + 335} 612 Z" fill="${C.roof}" ${O}/>`;
            s += `<circle cx="${x}" cy="548" r="27" fill="${C.dark}" ${O}/>`;
            const up = [x - 230, x - 45, x + 140];
            up.forEach((wx) => (s += win(wx, 650, 90, 92)));
            s += win(x - 230, 790, 90, 92);
            s += rect(x - 42, 782, 84, 148, C.green, `rx="6" ${O}`);
            s += `<circle cx="${x + 24}" cy="860" r="6" fill="${C.glow}"/>`;
            s += win(x + 140, 790, 90, 92, C.glow);
            s += person(x + 168, 882, 0.85) + person(x + 203, 882, 0.75);
            s += bush(x - 360, 140) + bush(x + 370, 120);
            s += `</g>`;
            // potential: every unused room
            let p = `<g id="st-pot-1" class="st-pot">`;
            up.forEach((wx) => (p += potRect(wx, 650, 90, 92)));
            p += potRect(x - 230, 790, 90, 92);
            p += `<circle class="st-pot-el" cx="${x}" cy="548" r="40"/>`;
            p += `</g>`;
            // realised: lights on, new neighbours
            let r = `<g id="st-real-1" class="st-real">`;
            up.forEach((wx) => (r += win(wx, 650, 90, 92, C.glow)));
            r += win(x - 230, 790, 90, 92, C.glow);
            r += `<circle cx="${x}" cy="548" r="27" fill="${C.glow}" ${O}/>`;
            r += person(x - 200, 742, 0.8) + person(x + 0, 742, 0.95) + person(x + 32, 742, 0.6) + person(x - 185, 882, 0.7);
            r += `</g>`;
            return s + p + r;
          }

          // ---------- station 2: empty shop & offices ----------
          function station2(x) {
            let s = `<g id="st-s2">`;
            s += rect(x - 280, 520, 560, 410, C.wall, O);
            s += rect(x - 300, 498, 600, 30, C.roof, `rx="4" ${O}`);
            const ups = [x - 240, x - 110, x + 20, x + 150];
            ups.forEach((wx) => (s += win(wx, 562, 90, 110)));
            s += rect(x - 280, 698, 560, 10, C.roof);
            s += rect(x - 240, 724, 300, 40, "#eef0e7", `rx="6" ${O}`);
            s += win(x - 240, 782, 300, 128, "#d5dad0");
            s += `<g id="st-shutter-2">` + rect(x - 240, 782, 300, 100, C.shutter, O);
            for (let ly = 798; ly < 880; ly += 16) s += `<line x1="${x - 234}" y1="${ly}" x2="${x + 54}" y2="${ly}" stroke="${C.ink2}" stroke-width="3"/>`;
            s += `</g>`;
            s += rect(x + 110, 782, 100, 148, C.roof, `rx="6" ${O}`);
            s += rect(x + 124, 808, 72, 36, C.wall, `rx="4" ${O}`);
            s += `<text x="${x + 160}" y="834" text-anchor="middle" font-family="Lato" font-weight="700" font-size="20" fill="${C.terra}">FREI</text>`;
            s += `</g>`;
            let p = `<g id="st-pot-2" class="st-pot">`;
            p += `<rect class="st-pot-el" x="${x - 262}" y="544" width="524" height="146" rx="12"/>`;
            p += potRect(x - 240, 782, 300, 128);
            p += `</g>`;
            let r = `<g id="st-real-2" class="st-real">`;
            ups.forEach((wx) => (r += win(wx, 562, 90, 110, C.glow)));
            r += win(x - 240, 782, 300, 128, C.glow);
            r += person(x - 170, 906, 0.9) + person(x - 120, 906, 0.7) + person(x - 10, 906, 0.85);
            r += person(x - 195, 668, 0.75) + person(x + 65, 668, 0.85);
            r += rect(x + 124, 808, 72, 36, C.green, `rx="4" ${O}`);
            r += `</g>`;
            return s + p + r;
          }

          // ---------- station 4: gap between buildings ----------
          function station4(x) {
            let s = `<g id="st-s4">`;
            // left neighbour (flat roof)
            s += rect(x - 470, 560, 300, 370, C.side, O);
            s += rect(x - 486, 540, 332, 26, C.roof, `rx="4" ${O}`);
            for (let row = 0; row < 3; row++) for (let c = 0; c < 2; c++) s += win(x - 440 + c * 120, 594 + row * 112, 76, 74, (row + c) % 2 ? C.glow : C.dark);
            // right neighbour (gable)
            s += `<path d="M${x + 170} 930 V600 L${x + 320} 486 L${x + 470} 600 V930 Z" fill="${C.side}" ${O}/>`;
            for (let row = 0; row < 2; row++) for (let c = 0; c < 2; c++) s += win(x + 214 + c * 130, 640 + row * 130, 76, 80, (row + c) % 2 ? C.dark : C.glow);
            // empty lot: grass tufts
            for (let i = 0; i < 6; i++) {
              const gx = x - 130 + i * 52;
              s += `<path d="M${gx} 930 q6 -28 12 0 q8 -22 14 0" fill="none" stroke="${C.green}" stroke-width="4" stroke-linecap="round"/>`;
            }
            s += `</g>`;
            let p = `<g id="st-pot-4" class="st-pot">`;
            p += `<path class="st-pot-el" d="M${x - 140} 930 V650 L${x} 528 L${x + 140} 650 V930"/>`;
            p += potRect(x - 96, 690, 70, 70) + potRect(x + 26, 690, 70, 70) + potRect(x - 34, 822, 68, 96);
            p += `</g>`;
            let r = `<g id="st-real-4" class="st-real">`;
            r += `<path d="M${x - 140} 930 V650 L${x} 528 L${x + 140} 650 V930 Z" fill="${C.wall}" ${O}/>`;
            r += `<path d="M${x - 162} 652 L${x} 516 L${x + 162} 652 Z" fill="${C.roof}" ${O}/>`;
            r += win(x - 96, 690, 70, 70, C.glow) + win(x + 26, 690, 70, 70, C.glow);
            r += rect(x - 34, 822, 68, 108, C.green, `rx="6" ${O}`);
            r += person(x - 62, 752, 0.62) + person(x + 62, 752, 0.7);
            r += `</g>`;
            return s + p + r;
          }

          // ---------- assemble the street ----------
          let w = "";
          w += `<defs><radialGradient id="st-spot-grad"><stop offset="0" stop-color="#dcebc4" stop-opacity="0.75"/><stop offset="1" stop-color="#dcebc4" stop-opacity="0"/></radialGradient></defs>`;
          X.forEach((x, i) => (w += `<ellipse class="st-spot" id="st-spot-${i + 1}" cx="${x}" cy="700" rx="520" ry="340" fill="url(#st-spot-grad)"/>`));
          w += rect(-400, GROUND, 6800, 700, C.walk);
          w += rect(-400, 1012, 6800, 700, C.road);
          w += `<line x1="-400" y1="${GROUND}" x2="6400" y2="${GROUND}" stroke="${C.ink}" stroke-width="5"/>`;
          w += `<line x1="-400" y1="1012" x2="6400" y2="1012" stroke="${C.ink2}" stroke-width="3"/>`;
          for (let dx = -380; dx < 6400; dx += 170) w += rect(dx, 1052, 86, 10, "#f7f8f2", 'rx="5"');
          // fillers
          w += plainHouse(150, 260, 230, 110) + tree(470, 0.95);
          w += lamp(1330) + tree(1480, 1.05);
          w += tree(2470, 0.9) + lamp(2600);
          w += tree(3500, 1.0) + plainHouse(3800, 280, 250, 120) + tree(4130, 0.9);
          w += station1(X[0]) + station2(X[1]) + station4(X[2]);
          document.getElementById("st-world-svg").innerHTML = w;

          // clouds (parallax layer)
          const cloud = (cx, cy, s) =>
            `<g opacity="0.9"><path d="M${cx - 120 * s} ${cy} a${46 * s} ${46 * s} 0 0 1 ${70 * s} ${-38 * s} a${62 * s} ${62 * s} 0 0 1 ${116 * s} ${-4 * s} a${44 * s} ${44 * s} 0 0 1 ${54 * s} ${42 * s} Z" fill="#fcfcfc" stroke="#2a3737" stroke-opacity="0.18" stroke-width="4"/></g>`;
          let cl = "";
          [
            [260, 160, 1.0],
            [900, 120, 0.7],
            [1500, 210, 1.15],
            [2150, 140, 0.8],
            [2800, 200, 1.05],
            [3450, 130, 0.75],
            [3950, 220, 0.95],
          ].forEach(([cx, cy, s]) => (cl += cloud(cx, cy, s)));
          document.getElementById("st-clouds-svg").innerHTML = cl;

          // sparkles for the peak (deterministic positions)
          const sparkWrap = document.getElementById("st-sparkles");
          const SPARKS = [
            [200, 600], [300, 545], [420, 585], [520, 640], [760, 600], [860, 550], [960, 585],
            [1080, 560], [1180, 630], [1400, 600], [1500, 550], [1620, 585], [1740, 632], [1040, 660],
          ];
          SPARKS.forEach(([sx, sy], i) => {
            const fill = i % 3 === 0 ? C.terra : C.glow;
            sparkWrap.insertAdjacentHTML(
              "beforeend",
              `<svg class="st-spark" style="left:${sx}px;top:${sy}px" viewBox="-17 -17 34 34"><path d="M0 -16 C2 -4 4 -2 16 0 C4 2 2 4 0 16 C-2 4 -4 2 -16 0 C-4 -2 -2 -4 0 -16 Z" fill="${fill}"/></svg>`,
            );
          });

          // ---------- timeline ----------
          const tl = gsap.timeline({ paused: true });
          const T = [2.25, 6.0, 9.75];
          const OVER = { x: -255, y: 323, scale: 0.62 };

          gsap.set(".st-card", { opacity: 0, scale: 0.6 });
          gsap.set(".st-cn", { opacity: 0 });
          gsap.set(".st-seg-fill", { scaleX: 0 });
          gsap.set(".st-pot", { opacity: 0 });
          gsap.set(".st-real", { opacity: 0 });
          gsap.set(".st-spot", { opacity: 0 });
          gsap.set(".st-spark", { scale: 0, opacity: 0, rotation: -40 });
          gsap.set("#st-shutter-2", { transformOrigin: "50% 0%" });
          gsap.set("#st-peak", { opacity: 0 });

          // establishing: the street slides in under the headline
          tl.fromTo("#st-world", { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 1.1, ease: "power2.out" }, 0);
          tl.fromTo("#st-clouds", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 1.4, ease: "power1.out" }, 0);
          tl.fromTo("#st-head .st-hw", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out", stagger: 0.08 }, 0.18);

          // headline becomes the sticky title
          tl.to("#st-head", { y: -134, scale: 0.465, duration: 0.6, ease: "power3.inOut" }, 1.7);
          tl.fromTo("#st-label", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 2.05);
          tl.fromTo("#st-count", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.1);

          // ambient: dashed potentials keep marching once visible
          tl.to(".st-pot-el", { strokeDashoffset: -240, duration: 17.5, ease: "none" }, 2.2);

          T.forEach((t, i) => {
            const n = i + 1;
            const id = IDS[i];
            if (i > 0) tl.to(`#st-cn-${i}`, { opacity: 0, y: -10, duration: 0.2, ease: "power1.in" }, t - 0.1);
            tl.fromTo(`#st-cn-${n}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
            tl.to(`#st-seg-${n}`, { scaleX: 1, duration: 0.5, ease: "power2.out" }, t);
            tl.to(`#st-spot-${n}`, { opacity: 1, duration: 0.5, ease: "power1.out" }, t - 0.1);
            tl.to(`#st-spot-${n}`, { opacity: 0, duration: 0.5, ease: "power1.in" }, t + 3.0);
            tl.fromTo(`#st-pot-${id}`, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.15);
            tl.fromTo(
              `#st-card-${n}`,
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.9)", immediateRender: false },
              t + 0.02,
            );
            tl.to(`#st-card-${n}`, { opacity: 0, y: -14, duration: 0.2, ease: "power1.in" }, t + 2.95);
            if (i < T.length - 1) {
              tl.to("#st-world", { x: -(i + 1) * 1000, duration: 0.7, ease: "power2.inOut" }, t + 3.05);
              tl.to("#st-clouds", { x: -(i + 1) * 340, duration: 0.7, ease: "power2.inOut" }, t + 3.05);
            }
          });

          // the shutter of the empty shop twitches once while we look at it
          tl.to("#st-shutter-2", { scaleY: 0.86, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, T[1] + 1.0);

          // overview: zoom out to the whole street
          tl.to(["#st-head", "#st-label", "#st-count", "#st-cn-3"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 12.75);
          tl.to("#st-world", { x: OVER.x, y: OVER.y, scale: OVER.scale, duration: 1.6, ease: "power3.inOut" }, 12.85);
          tl.to("#st-clouds", { x: -520, y: 100, opacity: 0.3, duration: 1.6, ease: "power3.inOut" }, 12.85);

          // PEAK (global 27.5 s): headline + the whole street comes alive
          tl.set("#st-peak", { opacity: 1 }, 14.95);
          tl.fromTo(".st-pw1", { yPercent: 110 }, { yPercent: 0, duration: 0.65, ease: "power4.out", stagger: 0.08 }, 15.0);
          tl.fromTo(".st-pw2", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "back.out(1.7)", stagger: 0.12 }, 15.35);
          tl.fromTo("#st-peak-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 16.3);
          IDS.forEach((id, k) => {
            const t = 15.4 + k * 0.35;
            tl.to(`#st-pot-${id}`, { opacity: 0, duration: 0.35, ease: "power1.in" }, t);
            tl.fromTo(`#st-real-${id}`, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.1);
          });
          tl.to("#st-shutter-2", { scaleY: 0, duration: 0.5, ease: "power2.inOut" }, 15.75);
          tl.to(".st-spark", { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(3)", stagger: 0.07 }, 15.8);
          tl.to(".st-spark", { scale: 0, opacity: 0, rotation: 30, duration: 0.5, ease: "power2.in", stagger: 0.07 }, 17.2);

          // breathe: a slow push-in on the living street
          tl.to("#st-world", { x: OVER.x - 40, y: OVER.y - 14, scale: OVER.scale * 1.035, duration: 4.1, ease: "sine.inOut" }, 15.4);

          // exit
          tl.to(["#st-peak", "#st-peak-sub"], { y: -30, opacity: 0, duration: 0.35, ease: "power2.in" }, 19.55);
          tl.to(["#st-world", "#st-clouds"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 19.6);

          window.__timelines["street"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
