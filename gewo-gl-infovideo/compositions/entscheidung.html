<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="entscheidung-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #2a3737;
          font-family: "Lato", sans-serif;
        }
        .en-label {
          position: absolute;
          left: 122px;
          top: 118px;
          font-weight: 700;
          font-size: 25px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #5e742e;
        }
        .en-head {
          position: absolute;
          left: 120px;
          top: 158px;
          font-weight: 700;
          font-size: 92px;
          line-height: 1.08;
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .en-line {
          display: block;
          overflow: hidden;
          padding-bottom: 16px;
          margin-bottom: -16px;
        }
        .en-w {
          display: inline-block;
          margin-right: 0.24em;
        }
        .en-accent {
          color: #5e742e;
        }
        .en-sub {
          position: absolute;
          left: 122px;
          top: 286px;
          font-weight: 700;
          font-size: 40px;
          line-height: 1.25;
          white-space: nowrap;
        }
        .en-rule {
          position: absolute;
          left: 120px;
          top: 372px;
          width: 1680px;
          height: 3px;
          background: #dee3db;
          transform-origin: 0 50%;
        }
        .en-row {
          position: absolute;
          left: 120px;
          width: 1680px;
          height: 140px;
        }
        .en-icon {
          position: absolute;
          left: 0;
          top: 0;
          width: 136px;
          height: 136px;
          border-radius: 50%;
          background: #e6f2dd;
        }
        .en-icon svg {
          position: absolute;
          left: 3px;
          top: 3px;
          width: 130px;
          height: 130px;
          overflow: visible;
        }
        .en-icon path,
        .en-icon circle,
        .en-icon rect {
          fill: none;
          stroke-width: 5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .en-title {
          position: absolute;
          left: 176px;
          top: 14px;
          display: flex;
          align-items: center;
          gap: 20px;
          font-weight: 700;
          font-size: 52px;
          line-height: 1.1;
          white-space: nowrap;
        }
        .en-pill {
          display: inline-block;
          padding: 6px 16px 7px;
          border: 3px solid #5e742e;
          border-radius: 30px;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #5e742e;
        }
        .en-desc {
          position: absolute;
          left: 178px;
          top: 86px;
          font-weight: 400;
          font-size: 34px;
          color: #5a6462;
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="entscheidung" data-width="1920" data-height="1080">
        <div class="en-label" id="en-label">Zusammenarbeit, die zu Ihnen passt</div>
        <div class="en-head" id="en-head">
          <span class="en-line"
            ><span class="en-w">Ihre</span><span class="en-w">Immobilie.</span><span class="en-w en-accent">Ihre</span
            ><span class="en-w en-accent">Entscheidung.</span></span
          >
        </div>
        <div class="en-sub" id="en-sub">Eine Zusammenarbeit mit gewo-gl bedeutet nicht, dass Sie verkaufen müssen.</div>
        <div class="en-rule" id="en-rule"></div>

        <div class="en-row" id="en-row-1" style="top: 418px">
          <div class="en-icon">
            <svg viewBox="0 0 130 130" aria-hidden="true">
              <path class="en-draw" d="M60 100 V62 L84 42 L108 62 V100 Z" stroke="#2a3737" />
              <rect class="en-draw" x="78" y="70" width="13" height="13" stroke="#2a3737" />
              <circle class="en-draw" cx="38" cy="62" r="9" stroke="#6ba221" />
              <path class="en-draw" d="M22 100 V90 Q22 76 38 76 Q54 76 54 90 V100" stroke="#6ba221" />
              <path class="en-draw" d="M28 46 L31 36 L38 42 L45 36 L48 46 Z" stroke="#6ba221" />
            </svg>
          </div>
          <div class="en-title">Eigentümer bleiben</div>
          <div class="en-desc">Sie behalten Ihre Immobilie – gemeinsam entwickeln wir Wohnkonzepte.</div>
        </div>

        <div class="en-row" id="en-row-2" style="top: 588px">
          <div class="en-icon">
            <svg viewBox="0 0 130 130" aria-hidden="true">
              <path class="en-draw" d="M16 98 V60 L42 40 L68 60 V98 Z" stroke="#2a3737" />
              <rect class="en-draw" x="35" y="68" width="13" height="13" stroke="#2a3737" />
              <circle class="en-draw" cx="84" cy="66" r="7" stroke="#6ba221" />
              <circle class="en-draw" cx="112" cy="66" r="7" stroke="#6ba221" />
              <circle class="en-draw" cx="98" cy="58" r="7" stroke="#2a3737" />
              <path class="en-draw" d="M74 98 V90 Q74 80 84 80 Q94 80 94 90 V98" stroke="#6ba221" />
              <path class="en-draw" d="M102 98 V90 Q102 80 112 80 Q122 80 122 90 V98" stroke="#6ba221" />
              <path class="en-draw" d="M88 84 Q88 72 98 72 Q108 72 108 84" stroke="#2a3737" />
            </svg>
          </div>
          <div class="en-title">An die Genossenschaft verkaufen <span class="en-pill">geplant</span></div>
          <div class="en-desc">Sie soll Wohnprojekte umsetzen und den Wohnraum langfristig bewirtschaften.</div>
        </div>

        <div class="en-row" id="en-row-3" style="top: 758px">
          <div class="en-icon">
            <svg viewBox="0 0 130 130" aria-hidden="true">
              <path class="en-draw" d="M40 84 V56 L60 40 L80 56 V84 Z" stroke="#2a3737" />
              <path class="en-draw" d="M100 84 V64" stroke="#6ba221" />
              <circle class="en-draw" cx="100" cy="54" r="10" stroke="#6ba221" />
              <path class="en-draw" d="M18 82 Q24 102 62 102 Q100 102 108 82" stroke="#6ba221" />
              <path class="en-draw" d="M18 82 L26 76 M108 82 L100 76" stroke="#6ba221" />
            </svg>
          </div>
          <div class="en-title">In die Stiftung einbringen <span class="en-pill">geplant</span></div>
          <div class="en-desc">Immobilien dauerhaft einem gemeinnützigen Wohnzweck widmen.</div>
        </div>
      </div>

      <script>
        (function () {
          document.querySelectorAll(".en-draw").forEach((p) => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = `${len}`;
            p.style.strokeDashoffset = `${len}`;
          });

          const tl = gsap.timeline({ paused: true });
          gsap.set(".en-pill", { scale: 0, opacity: 0 });

          tl.fromTo("#en-label", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.1);
          tl.fromTo("#en-head .en-w", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out", stagger: 0.09 }, 0.2);
          tl.fromTo("#en-sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 1.05);
          tl.fromTo("#en-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 1.3);

          [1, 2, 3].forEach((n, k) => {
            const t = 1.75 + k * 0.6;
            const row = `#en-row-${n}`;
            tl.fromTo(`${row} .en-icon`, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
            tl.to(`${row} .en-draw`, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.05 }, t + 0.15);
            tl.fromTo(`${row} .en-title`, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.1);
            tl.fromTo(`${row} .en-desc`, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t + 0.3);
          });
          tl.to(".en-pill", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.6)", stagger: 0.6 }, 2.75);

          // breathe: icons float gently, out of phase
          tl.to(".en-icon", { y: -6, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.2 }, 4.4);

          // exit
          tl.to(["#en-label", "#en-head", "#en-sub", "#en-rule"], { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.3);
          tl.to(".en-row", { x: 40, opacity: 0, duration: 0.32, ease: "power2.in", stagger: 0.03 }, 8.3);

          window.__timelines["entscheidung"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
