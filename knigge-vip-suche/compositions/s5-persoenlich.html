<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s5-persoenlich-template">
      <style>
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #444f4f;
        }
        .w {
          display: inline-block;
        }
        .s5-text {
          position: absolute;
          left: 6.5cqw;
          width: 44cqw;
          top: 29cqh;
        }
        .s5-k {
          margin: 0 0 2.4cqmin;
          font-family: "Montserrat", sans-serif;
          font-weight: 400;
          font-size: 5.2cqmin;
          line-height: 1.2;
          color: #5e6a6a;
        }
        .s5-m {
          margin: 0;
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          font-size: 6.4cqmin;
          line-height: 1.14;
          letter-spacing: -0.02em;
        }
        .s5-red {
          position: relative;
          display: inline-block;
          color: #ca2c35;
        }
        .s5-ul {
          position: absolute;
          left: 0;
          right: 0;
          bottom: -0.6cqmin;
          height: 0.7cqmin;
          border-radius: 0.35cqmin;
          background: #ca2c35;
        }

        /* ---------- Telefon ---------- */
        .s5-stage {
          position: absolute;
          left: calc(68cqw - 17cqmin);
          top: calc(50cqh - 33cqmin);
          width: 34cqmin;
          height: 66cqmin;
        }
        .s5-ring {
          position: absolute;
          inset: 0;
          border: 0.35cqmin solid #ca2c35;
          border-radius: 5cqmin;
        }
        .s5-phone {
          position: absolute;
          inset: 0;
          background: #ffffff;
          border: 0.45cqmin solid #444f4f;
          border-radius: 5cqmin;
          box-shadow: 0 1.6cqmin 4cqmin rgba(68, 79, 79, 0.18);
        }
        .s5-notch {
          position: absolute;
          left: 50%;
          top: 1.6cqmin;
          width: 10cqmin;
          height: 2.2cqmin;
          margin-left: -5cqmin;
          border-radius: 1.1cqmin;
          background: #444f4f;
        }
        .s5-screen {
          position: absolute;
          left: 2.6cqmin;
          right: 2.6cqmin;
          top: 6cqmin;
          bottom: 4.4cqmin;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .s5-incoming {
          margin: 1.6cqmin 0 0;
          font-size: 2.4cqmin;
          font-weight: 400;
          color: #5e6a6a;
        }
        .s5-avatar {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 15cqmin;
          height: 15cqmin;
          margin-top: 4.2cqmin;
          border-radius: 50%;
          background: #ffffff;
          border: 0.35cqmin solid #d4d8d3;
        }
        .s5-avatar svg {
          width: 8.4cqmin;
          height: 8.4cqmin;
        }
        .s5-pulse {
          position: absolute;
          inset: -0.35cqmin;
          border-radius: 50%;
          border: 0.4cqmin solid #ca2c35;
        }
        .s5-name {
          margin: 3.2cqmin 0 0;
          font-size: 3.2cqmin;
          font-weight: 700;
          line-height: 1.15;
        }
        .s5-place {
          margin: 0.8cqmin 0 0;
          font-size: 2.4cqmin;
          font-weight: 400;
          color: #5e6a6a;
        }
        .s5-btns {
          display: flex;
          gap: 9cqmin;
          margin-top: auto;
        }
        .s5-btn {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 8.6cqmin;
          height: 8.6cqmin;
          border-radius: 50%;
        }
        .s5-btn svg {
          width: 4.4cqmin;
          height: 4.4cqmin;
        }
        .s5-btn path {
          fill: #ffffff;
        }
        .s5-no {
          background: #aeb6b3;
        }
        .s5-no svg {
          transform: rotate(135deg);
        }
        .s5-yes {
          background: #ca2c35;
        }

        /* ---------- Treffer-Karte ---------- */
        .s5-card {
          position: absolute;
          left: calc(68cqw + 17cqmin);
          top: calc(50cqh - 25cqmin);
          width: 30cqmin;
          padding: 1.6cqmin;
          background: #ffffff;
          border: 0.3cqmin solid #ca2c35;
          border-radius: 1.2cqmin;
          box-shadow: 0 1.4cqmin 3.2cqmin rgba(68, 79, 79, 0.18);
        }
        .s5-thumb {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 13cqmin;
          border-radius: 0.7cqmin;
          background: #e3e7e2;
        }
        .s5-thumb svg {
          width: 62%;
          height: 74%;
          overflow: visible;
        }
        .s5-thumb .ln {
          fill: none;
          stroke: #444f4f;
          stroke-width: 2.2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .s5-thumb .wl {
          fill: #ffffff;
        }
        .s5-thumb .rf {
          fill: #ca2c35;
        }
        .s5-b1,
        .s5-b2 {
          height: 1.3cqmin;
          margin-top: 1.2cqmin;
          border-radius: 0.65cqmin;
        }
        .s5-b1 {
          width: 82%;
          background: #c9cec9;
        }
        .s5-b2 {
          width: 50%;
          background: #dfe2de;
        }
        .s5-badge {
          position: absolute;
          left: -2cqmin;
          top: -2.6cqmin;
          display: flex;
          align-items: center;
          gap: 0.7cqmin;
          padding: 0.8cqmin 1.6cqmin 0.9cqmin 1.2cqmin;
          border-radius: 1cqmin;
          background: #ca2c35;
          color: #ffffff;
          font-size: 2.5cqmin;
          font-weight: 700;
          white-space: nowrap;
          box-shadow: 0 0 0 0.45cqmin #ffffff;
        }
        .s5-badge svg {
          width: 2.8cqmin;
          height: 2.8cqmin;
        }
        .s5-badge path {
          fill: #ffffff;
        }

        /* ---------- 9:16 ---------- */
        @container scene (orientation: portrait) {
          #root .s5-text {
            left: 8cqw;
            width: 84cqw;
            top: 13.6cqh;
          }
          #root .s5-m {
            font-size: 6.6cqmin;
          }
          #root .s5-stage {
            left: calc(40cqw - 17cqmin);
            top: 37cqh;
          }
          #root .s5-card {
            left: calc(40cqw + 17cqmin);
            top: calc(37cqh + 8cqmin);
          }
        }
      </style>

      <div id="root" data-composition-id="s5-persoenlich" data-width="1920" data-height="1080" data-duration="7.5">
        <div class="s5-text">
          <p class="s5-k" id="s5-k">Mehr als ein Suchagent:</p>
          <p class="s5-m" id="s5-m">Passt ein Objekt besonders gut, melden wir uns <span class="s5-red" id="s5-red">persönlich<span class="s5-ul" id="s5-ul"></span></span>.</p>
        </div>

        <div class="s5-stage" id="s5-stage">
          <div class="s5-ring" id="s5-ring1"></div>
          <div class="s5-ring" id="s5-ring2"></div>
          <div class="s5-ring" id="s5-ring3"></div>
          <div class="s5-phone" id="s5-phone">
            <div class="s5-notch"></div>
            <div class="s5-screen">
              <p class="s5-incoming">Eingehender Anruf</p>
              <div class="s5-avatar" id="s5-avatar">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                  <defs>
                    <linearGradient id="s5-k-a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48.9" y2="39.6">
                      <stop offset="0" stop-color="#5e0f18" />
                      <stop offset="0.56" stop-color="#a4222b" />
                      <stop offset="0.8" stop-color="#c12a33" />
                      <stop offset="0.93" stop-color="#ca2c35" />
                    </linearGradient>
                    <linearGradient id="s5-k-r" gradientUnits="userSpaceOnUse" x1="47.5" y1="40.2" x2="100" y2="0">
                      <stop offset="0" stop-color="#4a0a13" />
                      <stop offset="1" stop-color="#b0252e" />
                    </linearGradient>
                    <linearGradient id="s5-k-b" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="100">
                      <stop offset="0" stop-color="#480a12" />
                      <stop offset="0.5" stop-color="#a2222b" />
                      <stop offset="0.85" stop-color="#ca2c35" />
                    </linearGradient>
                  </defs>
                  <path d="M0 0 H79.5 L0 100 Z" fill="url(#s5-k-a)" />
                  <path d="M79.5 0 H100 V100 L47.5 40.2 Z" fill="url(#s5-k-r)" />
                  <path d="M0 100 L47.5 40.2 L100 100 Z" fill="url(#s5-k-b)" />
                </svg>
                <div class="s5-pulse" id="s5-pulse"></div>
              </div>
              <p class="s5-name" id="s5-name">KNIGGE Immobilien</p>
              <p class="s5-place" id="s5-place">Bergisch Gladbach</p>
              <div class="s5-btns" id="s5-btns">
                <div class="s5-btn s5-no">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8 C8 13.6 10.4 16 13.2 17.4 L15.4 15.2 C15.7 14.9 16.1 14.8 16.5 15 C17.6 15.4 18.8 15.6 20 15.6 C20.6 15.6 21 16 21 16.6 V20 C21 20.6 20.6 21 20 21 C10.6 21 3 13.4 3 4 C3 3.4 3.4 3 4 3 H7.5 C8.1 3 8.5 3.4 8.5 4 C8.5 5.2 8.7 6.4 9.1 7.5 C9.2 7.9 9.1 8.3 8.8 8.6 Z" /></svg>
                </div>
                <div class="s5-btn s5-yes" id="s5-yes">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8 C8 13.6 10.4 16 13.2 17.4 L15.4 15.2 C15.7 14.9 16.1 14.8 16.5 15 C17.6 15.4 18.8 15.6 20 15.6 C20.6 15.6 21 16 21 16.6 V20 C21 20.6 20.6 21 20 21 C10.6 21 3 13.4 3 4 C3 3.4 3.4 3 4 3 H7.5 C8.1 3 8.5 3.4 8.5 4 C8.5 5.2 8.7 6.4 9.1 7.5 C9.2 7.9 9.1 8.3 8.8 8.6 Z" /></svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="s5-card" id="s5-card">
          <div class="s5-thumb">
            <svg viewBox="0 0 48 32" aria-hidden="true"><path class="rf" d="M5 16 L15 7 L25 16 Z M23 16 L33 7 L43 16 Z" /><path class="ln wl" d="M8 15.5 V29 H40 V15.5" /><path class="ln" d="M24 15.5 V29 M13 20 H17 V24 H13 Z M31 20 H35 V24 H31 Z" /></svg>
          </div>
          <div class="s5-b1"></div>
          <div class="s5-b2"></div>
          <div class="s5-badge" id="s5-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 L14.8 8.6 L21.2 9.4 L16.5 13.8 L17.7 20.2 L12 17.1 L6.3 20.2 L7.5 13.8 L2.8 9.4 L9.2 8.6 Z" /></svg>
            passt besonders gut
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s5-persoenlich"]');
          const $ = (s) => root.querySelector(s);
          const u = Math.min(root.clientWidth || 1920, root.clientHeight || 1080) / 100; // 1cqmin in px

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1 && !node.classList.contains("s5-ul")) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          // ---------- Text ----------
          wordsIn(splitWords($("#s5-k")), 0.3, 0.08, 0.6);
          wordsIn(splitWords($("#s5-m")), 0.9, 0.065, 0.6);
          tl.fromTo("#s5-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", transformOrigin: "0% 50%" }, 2.0);

          // ---------- Telefon klingelt ----------
          tl.fromTo("#s5-phone", { opacity: 0, y: 5 * u }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.5);
          tl.fromTo("#s5-avatar", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 1.0);
          tl.fromTo(["#s5-name", "#s5-place"], { opacity: 0, y: 1.2 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 1.2);
          tl.fromTo("#s5-btns", { opacity: 0, y: 1.2 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.35);

          // Ringwellen (sine-wave-loop, endlich ausgeschrieben; Ruhezustand = unsichtbar)
          for (let n = 0; n < 12; n++) {
            const t = 1.6 + n * 0.5;
            const ring = "#s5-ring" + ((n % 3) + 1);
            tl.fromTo(ring, { opacity: 0, scale: 1 }, { opacity: 0.6, duration: 0.08, ease: "none" }, t);
            tl.fromTo(ring, { opacity: 0.6, scale: 1 }, { opacity: 0, scale: 1.3, duration: 1.42, ease: "power1.out", immediateRender: false }, t + 0.08);
          }
          for (let n = 0; n < 8; n++) {
            const t = 1.6 + n * 0.75;
            tl.fromTo("#s5-pulse", { opacity: 0, scale: 1 }, { opacity: 0.9, duration: 0.06, ease: "none" }, t);
            tl.fromTo("#s5-pulse", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.69, ease: "power1.out", immediateRender: false }, t + 0.06);
            tl.fromTo("#s5-yes", { scale: 1 }, { scale: 1.1, duration: 0.3, ease: "sine.out", immediateRender: false }, t);
            tl.to("#s5-yes", { scale: 1, duration: 0.4, ease: "sine.in" }, t + 0.3);
          }
          // Vibrieren
          [1.7, 3.2, 4.7, 6.2].forEach((t) => {
            tl.to("#s5-stage", { rotation: 2.4, duration: 0.06, ease: "sine.inOut" }, t);
            tl.to("#s5-stage", { rotation: -2.4, duration: 0.09, ease: "sine.inOut" }, t + 0.065);
            tl.to("#s5-stage", { rotation: 1.6, duration: 0.09, ease: "sine.inOut" }, t + 0.16);
            tl.to("#s5-stage", { rotation: -1.0, duration: 0.09, ease: "sine.inOut" }, t + 0.255);
            tl.to("#s5-stage", { rotation: 0, duration: 0.12, ease: "sine.out" }, t + 0.35);
          });

          // ---------- Treffer-Karte ----------
          tl.fromTo("#s5-card", { opacity: 0, x: 3 * u, rotation: 6 }, { opacity: 1, x: 0, rotation: -2, duration: 0.7, ease: "back.out(1.6)" }, 2.5);
          tl.fromTo("#s5-badge", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)", transformOrigin: "20% 50%" }, 2.9);

          window.__timelines["s5-persoenlich"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
