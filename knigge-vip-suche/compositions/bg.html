<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="bg-template">
      <style>
        /* gemeinsamer Szenen-Root: füllt jeden Host (16:9 oder 9:16) */
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #444f4f;
        }
        .bg-fill {
          position: absolute;
          inset: 0;
          background: #eceeea;
        }
        .bg-glow {
          position: absolute;
          left: -30cqmax;
          top: -40cqmax;
          width: 100cqmax;
          height: 100cqmax;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(242, 195, 107, 0.2) 0%,
            rgba(242, 195, 107, 0.07) 38%,
            rgba(242, 195, 107, 0) 68%
          );
        }
        .bg-glow-red {
          position: absolute;
          right: -38cqmax;
          bottom: -44cqmax;
          width: 90cqmax;
          height: 90cqmax;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(202, 44, 53, 0.1) 0%,
            rgba(202, 44, 53, 0.04) 40%,
            rgba(202, 44, 53, 0) 68%
          );
        }
        .bg-ghost-wrap {
          position: absolute;
          right: -14cqmin;
          bottom: -20cqmin;
          width: 78cqmin;
          height: 78cqmin;
        }
        .bg-ghost {
          display: block;
          width: 100%;
          height: 100%;
          opacity: 0.14;
        }
        .bg-ghost .g-l {
          fill: #ca2c35;
          opacity: 0.32;
        }
        .bg-ghost .g-r {
          fill: #6d131b;
          opacity: 0.5;
        }
        .bg-ghost .g-b {
          fill: #ca2c35;
          opacity: 0.42;
        }
        .bg-ghost-small-wrap {
          position: absolute;
          left: -10cqmin;
          top: 58cqh;
          width: 36cqmin;
          height: 36cqmin;
        }
        @container scene (orientation: portrait) {
          .bg-ghost-small-wrap {
            top: 84cqh;
          }
        }
        .bg-grain {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          opacity: 0.35;
          mix-blend-mode: multiply;
        }
      </style>

      <div id="root" data-composition-id="bg" data-width="1920" data-height="1080" data-duration="60">
        <div class="bg-fill"></div>
        <div class="bg-glow" id="bg-glow" data-layout-allow-overflow></div>
        <div class="bg-glow-red" id="bg-glow-red" data-layout-allow-overflow></div>

        <!-- große, sehr leise K-Faltung (Bildmarke als Wasserzeichen) -->
        <div class="bg-ghost-wrap" data-layout-allow-overflow>
          <svg class="bg-ghost" id="bg-ghost" viewBox="-2 -2 104 104" aria-hidden="true">
            <path class="g-l" d="M0 0 H79.5 L0 100 Z" />
            <path class="g-r" d="M79.5 0 H100 V100 L47.5 40.2 Z" />
            <path class="g-b" d="M0 100 L47.5 40.2 L100 100 Z" />
          </svg>
        </div>
        <div class="bg-ghost-small-wrap" data-layout-allow-overflow>
          <svg class="bg-ghost" id="bg-ghost-small" viewBox="-2 -2 104 104" aria-hidden="true">
            <path class="g-l" d="M0 0 H79.5 L0 100 Z" />
            <path class="g-r" d="M79.5 0 H100 V100 L47.5 40.2 Z" />
            <path class="g-b" d="M0 100 L47.5 40.2 L100 100 Z" />
          </svg>
        </div>

        <!-- Papierkorn: statisch, deterministisch -->
        <svg class="bg-grain" aria-hidden="true">
          <filter id="bg-grain-filter" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" />
            <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.44  0 0 0 0.16 0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#bg-grain-filter)" />
        </svg>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // langsames Atmen/Driften über den ganzen Film (sine-wave-loop, endlich)
          tl.fromTo(
            "#bg-glow",
            { xPercent: 0, yPercent: 0, scale: 1 },
            { xPercent: 26, yPercent: 18, scale: 1.12, duration: 60, ease: "sine.inOut" },
            0,
          );
          tl.fromTo(
            "#bg-glow-red",
            { xPercent: 0, yPercent: 0 },
            { xPercent: -14, yPercent: -10, duration: 60, ease: "sine.inOut" },
            0,
          );
          tl.fromTo(
            "#bg-ghost",
            { rotation: -6, xPercent: 0 },
            { rotation: 5, xPercent: -6, duration: 60, ease: "sine.inOut", transformOrigin: "50% 50%" },
            0,
          );
          tl.fromTo(
            "#bg-ghost-small",
            { rotation: 8, yPercent: 0 },
            { rotation: -4, yPercent: -18, duration: 60, ease: "sine.inOut", transformOrigin: "50% 50%" },
            0,
          );
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
