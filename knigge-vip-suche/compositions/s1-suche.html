      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s1-suche"]');
          const $ = (s) => root.querySelector(s);
          const u = Math.min(root.clientWidth || 1920, root.clientHeight || 1080) / 100; // 1cqmin in px

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          // ---------- Hook: „Sie suchen eine Immobilie?“ + Zielgruppen-Chips ----------
          wordsIn(splitWords($("#s1-hook-q")), 0.25, 0.09, 0.7);
          ["#s1-c1", "#s1-c2", "#s1-c3"].forEach((c, i) =>
            tl.fromTo(c, { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(2.2)" }, 1.05 + i * 0.25),
          );
          tl.to("#s1-hook", { opacity: 0, y: -26, duration: 0.4, ease: "power2.in" }, 2.75);

          // ---------- Browser erscheint ----------
          tl.fromTo("#s1-browser", { opacity: 0, y: 34, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 3.12);
          tl.fromTo("#s1-kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.18);
          tl.fromTo("#s1-q", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "steps(30)" }, 3.45);

          // Uhr läuft (Abend für Abend)
          tl.fromTo("#s1-min", { rotation: 0 }, { rotation: 1440, duration: 9.1, ease: "none", svgOrigin: "12 12" }, 3.4);
          tl.fromTo("#s1-hour", { rotation: 0 }, { rotation: 120, duration: 9.1, ease: "none", svgOrigin: "12 12" }, 3.4);

          // ---------- Pain 1: Portale ----------
          wordsIn(splitWords($("#s1-p1")), 3.6, 0.08, 0.6);
          [3.95, 4.3, 4.6, 4.85, 5.05].forEach((t, i) =>
            tl.fromTo("#s1-t" + (i + 2), { opacity: 0, yPercent: 70 }, { opacity: 1, yPercent: 0, duration: 0.35, ease: "power2.out" }, t),
          );
          [1, 2, 3, 4, 5, 6].forEach((k, i) =>
            tl.fromTo("#s1-k" + k, { opacity: 0, y: 3 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.0 + i * 0.2),
          );
          tl.to("#s1-p1", { opacity: 0, yPercent: -25, duration: 0.35, ease: "power2.in" }, 6.15);

          // ---------- Pain 2: doppelt inseriert ----------
          wordsIn(splitWords($("#s1-p2")), 6.45, 0.08, 0.6);
          const dupe = (sel, t, d) =>
            tl.fromTo(sel, { x: 0, y: 0, opacity: 0 }, { x: d * u, y: d * u, opacity: 1, duration: 0.45, ease: "power2.out" }, t);
          const badge = (sel, t) =>
            tl.fromTo(sel, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, t);
          dupe("#s1-k1-c1", 6.8, 1.1);
          badge("#s1-k1-b", 6.95);
          dupe("#s1-k4-c1", 7.15, 1.1);
          badge("#s1-k4-b", 7.3);
          dupe("#s1-k5-c1", 7.5, 1.0);
          dupe("#s1-k5-c2", 7.62, 2.0);
          badge("#s1-k5-b", 7.8);
          tl.to("#s1-p2", { opacity: 0, yPercent: -25, duration: 0.35, ease: "power2.in" }, 8.7);
