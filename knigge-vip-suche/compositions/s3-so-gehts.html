              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="s3-env" d="M3 6 H21 V18 H3 Z M3 6 L12 13 L21 6" /></svg>
              <div class="s3-mailtxt">
                <p class="s3-from">KNIGGE VIP-Suche</p>
                <p class="s3-subj">3 neue Angebote für Ihr Suchprofil</p>
              </div>
              <div class="s3-new" id="s3-new">Neu</div>
            </div>
            <div class="s3-prev" id="s3-prev">
                  <div class="s3-mrow" id="s3-mr1">
                    <div class="s3-mthumb"><svg viewBox="0 0 48 32" aria-hidden="true"><path class="ln wl" d="M13 6 H35 V29 H13 Z" /><path class="rf" d="M11 4 H37 V7 H11 Z" /><path class="ln" d="M17 11 H21 M27 11 H31 M17 17 H21 M27 17 H31 M22 29 V24 H26 V29" /></svg></div>
                    <div class="s3-mtext"><div class="s3-gl1"></div><div class="s3-gl2"></div></div>
                    <div class="s3-mchk" id="s3-mc1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5 L10.2 16.5 L18 8" /></svg></div>
                  </div>
                  <div class="s3-mrow" id="s3-mr2">
                    <div class="s3-mthumb"><svg viewBox="0 0 48 32" aria-hidden="true"><path class="rf" d="M7 15 L24 4 L41 15 Z" /><path class="ln wl" d="M11 14.5 V29 H37 V14.5" /><path class="ln" d="M21 29 V22 H27 V29" /></svg></div>
                    <div class="s3-mtext"><div class="s3-gl1"></div><div class="s3-gl2"></div></div>
                    <div class="s3-mchk" id="s3-mc2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5 L10.2 16.5 L18 8" /></svg></div>
                  </div>
                  <div class="s3-mrow" id="s3-mr3">
                    <div class="s3-mthumb"><svg viewBox="0 0 48 32" aria-hidden="true"><path class="rf" d="M5 16 L15 7 L25 16 Z M23 16 L33 7 L43 16 Z" /><path class="ln wl" d="M8 15.5 V29 H40 V15.5" /><path class="ln" d="M24 15.5 V29" /></svg></div>
                    <div class="s3-mtext"><div class="s3-gl1"></div><div class="s3-gl2"></div></div>
                    <div class="s3-mchk" id="s3-mc3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5 L10.2 16.5 L18 8" /></svg></div>

          <svg class="s3-fly" id="s3-fly" viewBox="0 0 24 24" aria-hidden="true"><path class="s3-env" d="M3 6 H21 V18 H3 Z M3 6 L12 13 L21 6" /></svg>

          <div class="s3-toast" id="s3-toast">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5 H10.5 V19 H7 Z M13.5 5 H17 V19 H13.5 Z" /></svg>
            Jederzeit anpassen oder pausieren.
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s3-so-gehts"]');
          const $ = (s) => root.querySelector(s);
          const u = Math.min(root.clientWidth || 1920, root.clientHeight || 1080) / 100; // 1cqmin in px

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );
          const step = (k, t) => {
            tl.fromTo("#s3-n" + k, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, t);
            wordsIn(splitWords($("#s3-s" + k)), t + 0.15, 0.07, 0.55);
            if (k > 1) tl.to("#s3-n" + (k - 1), { backgroundColor: "#6d131b", duration: 0.3, ease: "power1.out" }, t);
          };
          const typeIn = (sel, t, n, d) =>
            tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + n + ")" }, t);
          const swapScreen = (outSel, inSel, t) => {
            tl.to(outSel, { opacity: 0, x: -3 * u, duration: 0.26, ease: "power2.in" }, t);
            tl.fromTo(inSel, { opacity: 0, x: 3 * u }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t + 0.28);
          };

          // ---------- Überschrift + Fenster ----------
          wordsIn(splitWords($("#s3-h")), 0.3, 0.08, 0.6);
          tl.fromTo("#s3-win", { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.7);

          // ---------- 1: Suchprofil hinterlegen ----------
          step(1, 1.0);
          tl.to("#s3-buy", { backgroundColor: "#6d131b", color: "#ffffff", duration: 0.3, ease: "power1.out" }, 1.6);
          tl.to("#s3-i1", { borderColor: "#ca2c35", duration: 0.2 }, 1.85);
          typeIn("#s3-v1", 1.9, 17, 0.75);
          tl.to("#s3-i1", { borderColor: "#c9cec9", duration: 0.2 }, 2.7);
          tl.to("#s3-i2", { borderColor: "#ca2c35", duration: 0.2 }, 2.7);
          typeIn("#s3-v2", 2.75, 5, 0.3);
          tl.to("#s3-i2", { borderColor: "#c9cec9", duration: 0.2 }, 3.1);
          tl.to("#s3-i3", { borderColor: "#ca2c35", duration: 0.2 }, 3.1);
          typeIn("#s3-v3", 3.15, 8, 0.4);
          tl.to("#s3-i3", { borderColor: "#c9cec9", duration: 0.2 }, 3.6);
          tl.to("#s3-btn", { scale: 0.94, duration: 0.12, ease: "power2.in" }, 3.6);
          tl.to("#s3-btn", { scale: 1, duration: 0.45, ease: "back.out(3)" }, 3.72);
          tl.fromTo("#s3-saved", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.8);

          // ---------- 2: Abgleich mit dem Markt ----------
          gsap.set(["#s3-scr2", "#s3-scr3"], { opacity: 0 });
          swapScreen("#s3-scr1", "#s3-scr2", 4.3);
          step(2, 4.5);
          [1, 2, 3, 4, 5, 6, 7, 8].forEach((k, i) =>
            tl.fromTo("#s3-g" + k, { opacity: 0, y: 2 * u }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.6 + i * 0.08),
          );
          tl.fromTo("#s3-cyc", { rotation: 0 }, { rotation: 720, duration: 7.4, ease: "none", transformOrigin: "50% 50%" }, 4.6);
          tl.fromTo("#s3-scan", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.3);
          tl.fromTo("#s3-scan", { xPercent: 0 }, { xPercent: 100, duration: 1.4, ease: "none", immediateRender: false }, 5.35);
          tl.to("#s3-scan", { opacity: 0, duration: 0.25 }, 6.8);
          const cols = [0, 1, 2, 3, 0, 1, 2, 3];
          const hitT = (k) => 5.35 + ((cols[k - 1] + 0.5) / 4) * 1.4;
          [2, 6, 8].forEach((k) => {
            tl.fromTo("#s3-g" + k, { borderColor: "#c9cec9", boxShadow: "0px 0px 0px 0px rgba(202, 44, 53, 0)" }, { borderColor: "#ca2c35", boxShadow: "0px 0px 0px " + (0.3 * u).toFixed(2) + "px rgba(202, 44, 53, 1)", duration: 0.2, immediateRender: false }, hitT(k));
            tl.fromTo("#s3-hb" + k, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(3)" }, hitT(k) + 0.05);
          });
          tl.to(["#s3-g1", "#s3-g3", "#s3-g4", "#s3-g5", "#s3-g7"], { opacity: 0.35, duration: 0.4, ease: "power1.out" }, 6.85);
          tl.fromTo("#s3-count", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)", transformOrigin: "0% 100%" }, 7.0);

          // ---------- 3: per E-Mail ----------
          swapScreen("#s3-scr2", "#s3-scr3", 7.85);
          step(3, 8.0);
          tl.fromTo("#s3-fly", { opacity: 0, x: -34 * u, y: -14 * u, rotation: -18, scale: 0.8 }, { opacity: 1, x: -20 * u, y: -9 * u, rotation: -10, scale: 1, duration: 0.25, ease: "power1.out" }, 8.1);
          tl.to("#s3-fly", { x: -18 * u, y: -4 * u, rotation: 0, scale: 0.55, duration: 0.45, ease: "power2.in" }, 8.35);
          tl.to("#s3-fly", { opacity: 0, duration: 0.12 }, 8.75);
          tl.fromTo("#s3-mail", { opacity: 0, y: -2.5 * u }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.62);
          tl.fromTo("#s3-new", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(3)" }, 8.85);
          tl.fromTo("#s3-prev", { opacity: 0, y: -1.5 * u }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.05);
          [1, 2, 3].forEach((k, i) => {
            tl.fromTo("#s3-mr" + k, { opacity: 0, x: -1.6 * u }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 9.2 + i * 0.18);
            tl.fromTo("#s3-mc" + k, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, 9.4 + i * 0.18);
          });

          // ---------- Hinweis: Kontrolle behalten ----------
          gsap.set("#s3-toast", { xPercent: -50 });
          tl.fromTo("#s3-toast", { opacity: 0, y: 2.5 * u }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 10.25);

          // ---------- Abblende ----------
          tl.to(["#s3-h", ".s3-steps", "#s3-win"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 12.0);

          window.__timelines["s3-so-gehts"] = tl;
        })();
      </script>
    </template>
  </body>
