      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s6-zugang"]');
          const $ = (s) => root.querySelector(s);

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });

          // Bildmarke faltet sich zusammen (logo-assemble-lockup)
          tl.fromTo("#s6-f-a", { opacity: 0, x: -70, y: -36 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.35);
          tl.fromTo("#s6-f-r", { opacity: 0, x: 70, y: -30 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.45);
          tl.fromTo("#s6-f-b", { opacity: 0, x: 0, y: 64 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.55);
          tl.fromTo("#s6-w1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.0);
          tl.fromTo("#s6-w2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.2);

          // Exklusivität + kleiner erster Schritt
          splitWords($("#s6-h")).forEach((w, i) =>
            tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: 0.65, ease: "power3.out" }, 1.85 + i * 0.1),
          );
          tl.fromTo("#s6-pill", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 2.7);
          tl.fromTo("#s6-url", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.0);
          tl.fromTo("#s6-note", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.25);

          // QR-Code
          tl.fromTo("#s6-qr", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 3.35);
          tl.fromTo("#s6-qrscan", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 4.0);
          tl.fromTo("#s6-qrscan", { yPercent: 0 }, { yPercent: 100, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 4.05);
