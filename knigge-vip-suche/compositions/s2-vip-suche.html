      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s2-vip-suche"]');
          const $ = (s) => root.querySelector(s);

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          // ---------- Text: Erleichterung -> Produktname -> Versprechen ----------
          wordsIn(splitWords($("#s2-kick")), 0.45, 0.08, 0.6);
          tl.fromTo("#s2-die", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.15);
          tl.fromTo("#s2-vip", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.9)", transformOrigin: "0% 70%" }, 1.3);
          wordsIn(splitWords($("#s2-sub")), 2.45, 0.055, 0.55);

          // ---------- Trichter zeichnet sich ----------
          tl.fromTo("#s2-body", { strokeDasharray: "1 2", strokeDashoffset: 1.05, fillOpacity: 0 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.35);
          tl.to("#s2-body", { fillOpacity: 1, duration: 0.5, ease: "power1.out" }, 0.9);
          tl.fromTo("#s2-rim", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.8);
          tl.fromTo(".s2-sieve", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.0);

          // ---------- Inserate fallen in den Filter (depth-scatter-assemble, 2D) ----------
          const starts = [[-236.4, -236.4, -9], [-97.7, -290.9, 6], [43.2, -257.6, -4], [193.2, -278.8, 8], [281.8, -148.5, -7], [-279.5, -112.1, 7], [-147.7, -154.5, -5], [136.4, -154.5, 5], [0.0, -184.8, -3]];
          starts.forEach(([xp, yp, r], i) => {
            const el = "#s2-in" + (i + 1);
            const t0 = 0.6 + i * 0.18;
            tl.fromTo(el, { xPercent: xp, yPercent: yp - 40, rotation: r, scale: 0.7, opacity: 0 }, { yPercent: yp, scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, t0);
            tl.to(el, { xPercent: 0, yPercent: 0, rotation: 0, scale: 0.32, duration: 0.75, ease: "power2.in" }, t0 + 0.5);
            tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, t0 + 1.07);
          });

          // ---------- Geordnete Trefferliste kommt heraus ----------
          tl.fromTo("#s2-glow", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 3.35);
          tl.fromTo("#s2-res", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 3.3);
          [1, 2, 3].forEach((k, i) => {
            tl.fromTo("#s2-row" + k, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.75 + i * 0.2);
            tl.fromTo("#s2-chk" + k, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.95 + i * 0.2);
          });

          // ---------- Abblende ----------
          tl.to([".s2-text", ".s2-art"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 7.05);

          window.__timelines["s2-vip-suche"] = tl;
        })();
