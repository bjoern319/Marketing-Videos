    <template id="s4-vorteil-template">
      <style>
        #root {
          position: absolute !important;
          inset: 0 !important;

          overflow: hidden;

        }

          display: inline-block;
        }

        }
        .s4-list {

          left: 6.5cqw;

          top: 28cqh;
        }
        .s4-row {
          display: flex;
          align-items: center;
          gap: 2.4cqmin;
          margin: 0 0 2.6cqmin;
        }
        .s4-tile {
          position: relative;
          flex: none;

          align-items: center;
          justify-content: center;
          width: 6.4cqmin;
          height: 6.4cqmin;
          border-radius: 1cqmin;

          border: 0.3cqmin solid #444f4f;
        }
        .s4-tile svg {
          width: 64%;
          height: 64%;
          overflow: visible;
        }
        .s4-tile path {
          fill: none;
          stroke: #444f4f;
          stroke-width: 1.9;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .s4-tile .s4-x {
          position: absolute;
          left: 18%;
          top: 18%;
          width: 64%;
          height: 64%;
        }
        .s4-tile .s4-x path {
          stroke: #ca2c35;
          stroke-width: 2.6;
        }
        .s4-tile.s4-good {
          background: #ca2c35;
          border-color: #ca2c35;
        }
        .s4-tile.s4-good path {
          stroke: #ffffff;
          stroke-width: 2.8;
        }
        .s4-txt {
          position: relative;
          margin: 0;
          font-family: "Montserrat", sans-serif;
          font-weight: 400;
          font-size: 4.5cqmin;
          line-height: 1.2;
        }
        /* Durchstreichen über alle Zeilen: Hintergrund-Linie, die sich über die Zeilenfragmente zieht */
        .s4-strk {
          --s: 0;
          background-image: linear-gradient(#ca2c35, #ca2c35);
          background-repeat: no-repeat;
          background-position: 0 56%;
          background-size: calc(var(--s) * 100%) 0.5cqmin;
        }
        .s4-txt.s4-goodtxt {
          font-weight: 700;
          font-size: 4.7cqmin;
        }
        .s4-claim {
          position: absolute;
          left: 0;
          width: 52cqw;
          top: 0;
          margin: 0;
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          font-size: 6.2cqmin;
          line-height: 1.14;
          letter-spacing: -0.02em;
        }
        .s4-red {
          position: relative;
          display: inline-block;
          color: #ca2c35;
        }
        .s4-ul {
          position: absolute;
          left: 0;
          right: 0;
          bottom: -0.7cqmin;
          height: 0.7cqmin;
          border-radius: 0.35cqmin;
          background: #ca2c35;
        }

        /* Marktkarte */
        .s4-map {
          position: absolute;
          right: 5.5cqw;
          top: calc(50cqh - 26cqmin);
          width: 64cqmin;
          height: 52cqmin;

          inset: 0;
          width: 100%;
          height: 100%;
        }

          left: 0;
          right: 0;
          top: 0;

        .s4-road-o {

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s4-vorteil"]');
          const $ = (s) => root.querySelector(s);
          const u = Math.min(root.clientWidth || 1920, root.clientHeight || 1080) / 100; // 1cqmin in px

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1 && !node.classList.contains("s4-ul")) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          wordsIn(splitWords($("#s4-k")), 0.3, 0.08, 0.6);

          // ---------- Marktkarte: erst der ganze, unübersichtliche Markt ----------
          tl.fromTo("#s4-map", { opacity: 0, x: 3 * u }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.55);
          tl.fromTo("#s4-road", { strokeDasharray: "1 2", strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 0.8);
          tl.fromTo("#s4-water", { strokeDasharray: "1 2", strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 0.75);
          tl.fromTo(["#s4-park1", "#s4-park2", "#s4-blocks"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.0);
          root.querySelectorAll(".s4-gp").forEach((p, i) =>
            tl.fromTo(p, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 1.0 + i * 0.11),
          );
          tl.fromTo("#s4-chip", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 4.25);

          // ---------- Lasten werden durchgestrichen (Kontrastprinzip) ----------
          const burden = (k, t) => {
            tl.fromTo("#s4-r" + k, { opacity: 0, x: -2 * u }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t);
            tl.fromTo("#s4-st" + k, { "--s": 0 }, { "--s": 1, duration: 0.45, ease: "power1.inOut" }, t + 0.7);
            tl.to("#s4-i" + k, { opacity: 0, duration: 0.2, ease: "power1.in" }, t + 0.72);
            tl.fromTo("#s4-x" + k, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, t + 0.78);
            tl.to("#s4-r" + k + " .s4-tile", { borderColor: "#ca2c35", duration: 0.25 }, t + 0.78);
            tl.to("#s4-t" + k, { color: "#5e6a6a", duration: 0.3 }, t + 0.8);
          };
          burden(1, 0.8);
          burden(2, 1.8);
          burden(3, 2.8);

          // ---------- Der Gewinn: gefilterte Übersicht ----------
          tl.fromTo("#s4-g", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 3.85);
          tl.fromTo("#s4-t4", { opacity: 0, x: -1.5 * u }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.0);
          tl.to("#s4-gray", { opacity: 0.22, duration: 0.5, ease: "power1.out" }, 4.0);
          root.querySelectorAll(".s4-rp").forEach((p, i) =>
            tl.fromTo(p, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(2.4)" }, 4.15 + i * 0.13),
          );

          // ---------- Claim: Lasten gehen, Übersicht bleibt ----------
          tl.to(["#s4-r1", "#s4-r2", "#s4-r3", "#s4-r4"], { opacity: 0, x: -2 * u, duration: 0.35, ease: "power2.in", stagger: 0.05 }, 5.55);
          wordsIn(splitWords($("#s4-l1")), 5.95, 0.08, 0.6);
          wordsIn(splitWords($("#s4-l2")), 6.35, 0.08, 0.6);
          tl.fromTo("#s4-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", transformOrigin: "0% 50%" }, 7.0);

          // ---------- Abblende ----------
          tl.to(["#s4-k", "#s4-list", "#s4-map"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 9.55);

          window.__timelines["s4-vorteil"] = tl;
        })();
      </script>
