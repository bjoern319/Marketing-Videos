<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KNIGGE Immobilien – VIP-Suche (16:9 · YouTube)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #eceeea;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eceeea;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      KNIGGE Immobilien – VIP-Suche (16:9 · YouTube)
      Szenen: compositions/*.html (gemeinsam für 16:9 und 9:16, Layout per Container-Queries)
      Musik: assets/audio/knigge-vip-theme.m4a (96 BPM, 1 Takt = 2,5 s; Szenen liegen auf Taktgrenzen)
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="el-bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="60" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="el-s1" data-composition-id="s1-suche" data-composition-src="compositions/s1-suche.html" data-start="0" data-duration="12.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s2" data-composition-id="s2-vip-suche" data-composition-src="compositions/s2-vip-suche.html" data-start="12.5" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s3" data-composition-id="s3-so-gehts" data-composition-src="compositions/s3-so-gehts.html" data-start="20" data-duration="12.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s4" data-composition-id="s4-vorteil" data-composition-src="compositions/s4-vorteil.html" data-start="32.5" data-duration="10" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s5" data-composition-id="s5-persoenlich" data-composition-src="compositions/s5-persoenlich.html" data-start="42.5" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-s6" data-composition-id="s6-zugang" data-composition-src="compositions/s6-zugang.html" data-start="50" data-duration="10" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-duration="60" data-track-index="2" data-width="1920" data-height="1080"></div>
      <audio
        id="el-music"
        src="assets/audio/knigge-vip-theme.m4a"
        data-start="0"
        data-duration="60"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
