      const CY = 500;
      const U = 165;
      const PLACES = [

        ["Paffrath", -1.35, -1.05],
        ["Hand", -0.35, -1.45],
        ["Sand", 0.95, -0.55],
        ["Herkenrath", 1.85, -0.45],
        ["Moitzfeld", 1.9, 1.15],
        ["Bensberg", 1.15, 1.45],
        ["Frankenforst", 0.25, 2.25],
        ["Refrath", -0.75, 2.0],
        ["Gronau", -1.15, 0.3],
      ];
      const net = document.getElementById("f06-net");
      const nodes = document.getElementById("f06-nodes");
      const NS = "http://www.w3.org/2000/svg";

      PLACES.forEach((p, i) => {
        const x = CX + p[1] * U;
        const y = CY + p[2] * U;
        const line = document.createElementNS(NS, "line");
        line.setAttribute("x1", CX);
        line.setAttribute("y1", CY);
        line.setAttribute("x2", x);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "rgba(255,255,255,0.2)");
        line.setAttribute("stroke-width", "1.5");
        line.setAttribute("id", `f06-l-${i}`);
        net.appendChild(line);

        const dot = document.createElement("span");
        dot.className = "f06-node";
        dot.id = `f06-d-${i}`;
        dot.style.left = x + "px";
        dot.style.top = y + "px";
        nodes.appendChild(dot);

        const label = document.createElement("span");
        label.className = "f06-label";
        label.id = `f06-t-${i}`;
        label.textContent = p[0];
        label.style.top = y - 15 + "px";
        if (p[1] < 0) {
          label.style.right = 1920 - (x - 18) + "px";
        } else {
          label.style.left = x + 18 + "px";
        }
        nodes.appendChild(label);
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#f06-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.0);

      // Die Nadel: KNIGGE in der Stadtmitte

          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
          T + 0.35
        );

          `#f06-t-${i}`,
          { opacity: 0, x: p[1] < 0 ? 10 : -10 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          T + 0.4
        );
