  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Inverse Zoom: die rote Fläche aus Frame 1 zieht sich zur Bildmarke zusammen.
      // (Die rote Fläche liegt UNTER der Bildmarke und bleibt danach verdeckt.)
      tl.fromTo(
        "#f02-red",
        { clipPath: "inset(0px 0px 0px 0px)" },
        { clipPath: "inset(290px 1136px 650px 644px)", duration: 1.0, ease: "power3.inOut" },
        0.1
      );
      // Die Bildmarke legt sich darüber, die Facetten falten sich ein.
      tl.fromTo("#f02-icon", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.0);
      tl.fromTo("#f02-fr", { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.0);
      tl.fromTo("#f02-fb", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.08);

      // Wortmarke
      tl.fromTo(
        "#f02-knigge",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.out" },
        1.2
      );
      // IMMOBILIEN läuft von außen zusammen (Tracking-in über x je Buchstabe).
      const immo = document.getElementById("f02-immo");
      const letters = immo.textContent.split("");
      immo.textContent = "";
      letters.forEach((ch) => {
        const s = document.createElement("span");
        s.className = "f02-ch";
        s.setAttribute("data-layout-allow-overlap", "");
        s.textContent = ch;
        immo.appendChild(s);
      });
      const chars = immo.querySelectorAll(".f02-ch");
      chars.forEach((c, i) => {
        tl.fromTo(
          c,
          { opacity: 0, x: (i - (chars.length - 1) / 2) * 16 },
          { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" },
          1.45 + i * 0.02
        );
      });

      // Motto
      tl.fromTo("#f02-m1", { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, 2.3);
      tl.fromTo("#f02-m2", { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, 2.6);
