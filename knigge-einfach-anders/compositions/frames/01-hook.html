  <script>
    (function () {
      // 4 × 5 Raster identischer Häuser – Feld 8 (Reihe 2, Spalte 4) wird zum KNIGGE-Quadrat.
      const grid = document.getElementById("f01-grid");
      const COLS = 5;
      const ROWS = 4;
      const PITCH = 144;
      const SPECIAL = 8;
      const house =
        '<svg class="f01-house" viewBox="0 0 60 60">' +
        '<path d="M30 8 L54 28 L48 28 L48 52 L12 52 L12 28 L6 28 Z" fill="#b3bcb9"/>' +

      for (let i = 0; i < COLS * ROWS; i++) {
        const t = document.createElement("div");
        t.className = i === SPECIAL ? "f01-tile f01-special" : "f01-tile f01-plain";
        t.style.left = (i % COLS) * PITCH + "px";
        t.style.top = Math.floor(i / COLS) * PITCH + "px";
        t.innerHTML = house;
        grid.appendChild(t);
      }

      const tl = gsap.timeline({ paused: true });

      // Ein Meer gleicher Häuser baut sich auf (Gleichförmigkeit).
      tl.fromTo(
        ".f01-tile",
        { opacity: 0, scale: 0.7, y: 24 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
          stagger: { grid: [ROWS, COLS], from: "center", amount: 1.3 },

        0.15

      tl.fromTo("#f01-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 0.3);

      // Von-Restorff: alles tritt zurück, ein Feld wird rot.
      tl.to(".f01-plain", { opacity: 0.36, duration: 0.6, ease: "power2.out" }, 3.15);
      tl.to(["#f01-l1", "#f01-l2"], { color: "#7a8585", duration: 0.6, ease: "power2.out" }, 3.15);
      tl.to(".f01-special .f01-house", { opacity: 0, duration: 0.2, ease: "power1.out" }, 3.2);
      tl.fromTo(
        "#f01-icon",
        { opacity: 0, scale: 0.35, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        3.25
      );
      tl.fromTo("#f01-l3", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 3.45);

      // Zoom-to-target: das rote Quadrat füllt das Bild (Match-Cut in Frame 2).

      tl.to(
        ["#f01-icon", "#f01-zoom"],
        { scale: 19, x: -638, y: 72, duration: 1.2, ease: "power3.in" },
