<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- KNIGGE Bildmarke (K-Faltung), Geometrie und Verläufe wie im Projekt
       knigge-wohnen-im-ruhestand (am Website-Logo vermessen). Für den offiziellen
       Einsatz die Original-Vektordatei verwenden. -->
  <defs>
    <linearGradient id="kg-left" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48.9" y2="39.6">
      <stop offset="0" stop-color="#5e0f18"/>
      <stop offset="0.56" stop-color="#a4222b"/>
      <stop offset="0.8" stop-color="#c12a33"/>
      <stop offset="0.93" stop-color="#ca2c35"/>
    </linearGradient>
    <linearGradient id="kg-right" gradientUnits="userSpaceOnUse" x1="47.5" y1="40.2" x2="100" y2="0">
      <stop offset="0" stop-color="#4a0a13"/>
      <stop offset="1" stop-color="#b0252e"/>
    </linearGradient>
    <linearGradient id="kg-bottom" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="100">
      <stop offset="0" stop-color="#480a12"/>
      <stop offset="0.5" stop-color="#a2222b"/>
      <stop offset="0.85" stop-color="#ca2c35"/>
    </linearGradient>
  </defs>
  <polygon points="0,0 79.5,0 0,100" fill="url(#kg-left)"/>
  <polygon points="79.5,0 100,0 100,100 47.5,40.2" fill="url(#kg-right)"/>
  <polygon points="47.5,40.2 100,100 0,100" fill="url(#kg-bottom)"/>
</svg>
