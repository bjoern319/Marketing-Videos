      <style>
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #444f4f;
        }

        /* ---------- Layout 16:9 (Illustration identisch zu Szene 1) ---------- */
        .s2-art {
          position: absolute;
          right: 3cqw;
          bottom: 9cqh;
          width: 50cqw;
          aspect-ratio: 4 / 3;
          --p: 0;
        }
        .s2-art-inner {
          width: 100%;
          height: 100%;
          filter: saturate(0.45) brightness(0.97);
        }
        .s2-art svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .s2-copy {
          position: absolute;
          left: 6.5cqw;
          top: 14cqh;
          bottom: 12cqh;
          width: 45cqw;
        }
        .s2-slot {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .s2-list {
          position: absolute;
          left: 6.5cqw;
          top: 13cqh;
          bottom: 10cqh;
          width: 40cqw;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        /* ---------- Layout 9:16 ---------- */
        @container scene (orientation: portrait) {
          .s2-art {
            right: auto;
            left: 8cqw;
            bottom: auto;
            top: 40cqh;
            width: 84cqw;
            transform-origin: 50% 0%;
            transform: translateY(calc(var(--p) * -25cqh)) scale(calc(1 - var(--p) * 0.4));
          }
          .s2-copy {
            left: 8cqw;
            width: 84cqw;
            top: 15cqh;
            bottom: auto;
            height: 23cqh;
          }
          #root .s2-claim-2 {
            font-size: 10.6cqmin;
          }
          #root .s2-q {
            max-width: none;
            font-size: 6.3cqmin;
          }
          #root .s2-row-text {
            font-size: 4.6cqmin;
          }
          .s2-list {
            left: 8cqw;
            width: 84cqw;
            top: 39cqh;
            bottom: 21cqh;
            justify-content: flex-start;
          }
        }

        /* ---------- Typografie ---------- */
        .s2-serif {
          font-family: "Montserrat", sans-serif;
          font-weight: 400;
        }
        .s2-q {
          margin: 0;
          max-width: 37cqw;
          font-size: 5.6cqmin;
          line-height: 1.2;
          letter-spacing: -0.01em;
        }
        .s2-claim-1 {
          margin: 0;
          font-size: 6.4cqmin;
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: -0.02em;
        }
        .s2-claim-2 {
          position: relative;
          display: inline-block;
          margin: 1.2cqmin 0 0;
          font-size: 11.5cqmin;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.035em;
          color: #ca2c35;
        }
        .s2-underline {
          position: absolute;
          left: -1%;
          bottom: -2.6cqmin;
          width: 102%;
          height: 3.4cqmin;
          overflow: visible;
        }
        .s2-underline path {
          fill: none;
          stroke: #ca2c35;
          stroke-width: 6;
          stroke-linecap: round;
          stroke-dasharray: 1 2;
          stroke-dashoffset: 1.05;
        }
        .s2-head {
          margin: 0 0 2.6cqmin;
          font-size: 4.6cqmin;
          line-height: 1.1;
        }
        .s2-row {
          display: flex;
          align-items: center;
          gap: 2.6cqmin;
          margin: 0 0 2cqmin;
        }
        .s2-ico {
          flex: 0 0 auto;
          width: 7.6cqmin;
          height: 7.6cqmin;
          border-radius: 1.1cqmin;
          background: #6d131b;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s2-ico svg {
          width: 58%;
          height: 58%;
          overflow: visible;
        }
        .s2-ico path,
        .s2-ico circle,
        .s2-ico rect {
          fill: none;
          stroke: #ffffff;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .s2-row-text {
          margin: 0;
          font-size: 4.3cqmin;
          font-weight: 400;
          line-height: 1.2;
          color: #5e6a6a;
        }
        .s2-row-text b {
          font-weight: 700;
          color: #444f4f;
        }
        .w {
          display: inline-block;
        }

        /* ---------- Illustration ---------- */
        .ln {
          fill: none;
          stroke: #444f4f;
          stroke-width: 3.2;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1 2;
          stroke-dashoffset: 1.05;
        }
        .ln.fl {
          fill-opacity: 0;
        }
        .ln.f-red {
          fill: #ca2c35;
        }
        .ln.f-deep {
          fill: #6d131b;
        }
        .ln.f-paper {
          fill: #ffffff;
        }
        .ln.f-sand {
          fill: #dfe3dd;
        }
        .ln.f-leaf {
          fill: #b9c2a0;
        }
        .ln.f-glass {
          fill: #c9d2da;
        }
        /* Haus aus Szene 1: startet vollständig gezeichnet, Licht aus */
        .s2-house .ln {
          stroke-dashoffset: 0;
        }
        .s2-house .ln.fl {
          fill-opacity: 1;
        }
        .s2h-glass {
          fill: #aeb6bf;
        }
        .s2h-light,
        .s2h-glow {
          fill: #f2c36b;
          opacity: 0;
        }
        /* Wohnung */
        .s2-glass {
          fill: #aeb6bf;
          opacity: 0;
        }
        .s2-light {
          fill: #f2c36b;
          opacity: 0;
        }
        .s2-glow {
          fill: #f2c36b;
          opacity: 0;
        }
        .s2-pop {
          opacity: 0;
        }
      </style>

          </div>
          <div class="s2-row" id="s2-r3">
            <div class="s2-ico"><svg viewBox="0 0 24 24"><path d="M12 21.5 C12 21.5 5 14.5 5 9.5 A7 7 0 0 1 19 9.5 C19 14.5 12 21.5 12 21.5 Z" /><circle cx="12" cy="9.5" r="2.6" /></svg></div>
            <p class="s2-row-text"><b>Bäcker &amp; Arzt</b> um die Ecke.</p>
          </div>
          <div class="s2-row" id="s2-r4">
            <div class="s2-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="11.5" rx="2" /><path d="M9 8 V5.5 H15 V8 M8 8 V19.5 M16 8 V19.5" /></svg></div>
            <p class="s2-row-text"><b>Tür zu</b> – und sorgenfrei verreisen.</p>
          </div>
          <div class="s2-row" id="s2-r5">
            <div class="s2-ico"><svg viewBox="0 0 24 24"><path d="M12 20 C5 15 3 11.5 3 8.6 A4.6 4.6 0 0 1 12 6.6 A4.6 4.6 0 0 1 21 8.6 C21 11.5 19 15 12 20 Z" /></svg></div>
            <p class="s2-row-text"><b>Freies Kapital</b> für Enkel &amp; Herzenswünsche.</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s2-mehr-leben"]');
          const $ = (s) => root.querySelector(s);
          const $$ = (s) => Array.from(root.querySelectorAll(s));

          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1 && node.tagName !== "svg") splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          // Startzustand = Endzustand Szene 1 (Sonne tief/blass, Haus entsättigt)
          tl.fromTo("#s2-sun", { opacity: 0.18, y: 70 }, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out", svgOrigin: "668 116" }, 1.9);
          tl.fromTo("#s2-art-inner", { filter: "saturate(0.45) brightness(0.97)" }, { filter: "saturate(1) brightness(1)", duration: 1.5, ease: "sine.inOut" }, 1.2);

          // ---------- Phase 1: Frage ----------
          wordsIn(splitWords($("#s2-q1")), 0.2, 0.05, 0.65);
          tl.to("#s2-t1", { opacity: 0, y: -14, duration: 0.35, ease: "power2.in" }, 2.4);

          // Haus zeichnet sich zurück ...
          const houseLines = $$(".s2-house .ln");
          houseLines.forEach((p, i) => {
            tl.fromTo(p, { strokeDashoffset: 0 }, { strokeDashoffset: -1.05, duration: 0.75, ease: "power2.in" }, 0.95 + (i % 10) * 0.03);
          });
          tl.fromTo($$(".s2-house .ln.fl"), { fillOpacity: 1 }, { fillOpacity: 0, duration: 0.5, ease: "power1.in" }, 0.9);
          tl.fromTo($$(".s2h-glass"), { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.in" }, 0.9);
          tl.to("#s2-house-all", { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.75);

          // ... und die Wohnung zeichnet sich auf (svg-path-draw)
          const aptLines = $$(".s2-apt .ln");
          aptLines.forEach((p, i) => {
            tl.fromTo(p, { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.out" }, 1.35 + (i % 14) * 0.05);
          });
          tl.fromTo($$(".s2-apt .ln.fl:not(#s2-rail)"), { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.6, ease: "power1.out", stagger: 0.015 }, 2.15);
          tl.fromTo("#s2-rail", { fillOpacity: 0 }, { fillOpacity: 0.55, duration: 0.6, ease: "power1.out" }, 2.4);
          tl.fromTo($$(".s2-glass"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.25);
          const wins = $$(".s2-win").sort((a, b) => +a.dataset.order - +b.dataset.order);
          wins.forEach((w, i) => {
            const t = 2.7 + i * 0.09;
            tl.fromTo(w.querySelector(".s2-light"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t);
            tl.fromTo(w.querySelector(".s2-glow"), { opacity: 0 }, { opacity: 0.75, duration: 0.4, ease: "power1.out" }, t);
          });
          tl.fromTo("#s2-shop-light", { opacity: 0 }, { opacity: 0.85, duration: 0.4 }, 2.9);
          tl.fromTo("#s2-lift", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.6);
          tl.fromTo("#s2-shop-sign", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.8);

          // ---------- Claim (Taktschlag bei 21 s = lokal 3.0) ----------
          tl.fromTo("#s2-claim-1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.6);
          tl.fromTo("#s2-claim-2", { opacity: 0, scale: 0.9, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.6)", transformOrigin: "0% 70%" }, 3.0);
          tl.fromTo("#s2-underline", { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.55);
          tl.to("#s2-t2", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.4);

          // Hochformat: Illustration rückt nach oben und wird kleiner (Landscape: --p wirkt nicht)
          tl.fromTo("#s2-art", { "--p": 0 }, { "--p": 1, duration: 0.9, ease: "power2.inOut" }, 5.6);

          // ---------- Phase 2: Vorteile ----------
          wordsIn(splitWords($("#s2-head")), 6.2, 0.1, 0.7);
          const rows = ["#s2-r1", "#s2-r2", "#s2-r3", "#s2-r4", "#s2-r5"];
          const rowT = [7.0, 9.6, 12.2, 14.8, 17.4];
          rows.forEach((r, i) => {
            const t = rowT[i];
            const row = $(r);
            tl.fromTo(row.querySelector(".s2-ico"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2)" }, t);
            tl.fromTo(row.querySelector(".s2-row-text"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t + 0.12);
            if (i > 0) tl.to(rows[i - 1], { opacity: 0.5, duration: 0.4, ease: "power1.inOut" }, t);
          });
          tl.to(rows.slice(0, 4), { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 19.3);

          // Illustration reagiert auf jeden Vorteil (svg-icon-enrichment)
          // 1 Aufzug fährt hoch
          tl.to("#s2-lift", { y: -128, duration: 1.6, ease: "power2.inOut" }, 7.2);
          // 2 Balkon: Pflanze wächst, Kaffee dampft, Sonne leuchtet
          tl.fromTo("#s2-plant", { scale: 1 }, { scale: 1.18, duration: 0.8, ease: "back.out(2)", svgOrigin: "372 312" }, 9.8);
          $$(".s2-steam").forEach((s, i) => {
            for (let c = 0; c < 3; c++) {
              const t = 9.8 + i * 0.5 + c * 1.6;
              tl.fromTo(s, { opacity: 0, y: 0 }, { opacity: 0.9, y: -6, duration: 0.7, ease: "sine.out", immediateRender: false }, t);
              tl.to(s, { opacity: 0, y: -16, duration: 0.8, ease: "sine.in" }, t + 0.7);
            }
          });
          tl.fromTo("#s2-sun", { scale: 1 }, { scale: 1.12, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, svgOrigin: "668 116", immediateRender: false }, 9.8);
          // 3 Bäckerei-Markise + Praxis-Schild
          tl.fromTo("#s2-awning", { scaleY: 1 }, { scaleY: 1.18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, svgOrigin: "358 428" }, 12.4);
          tl.fromTo("#s2-praxis", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)", svgOrigin: "554 458" }, 12.6);
          // 4 Flugzeug zieht über den Himmel
          tl.fromTo("#s2-trail", { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 15.0);
          tl.fromTo("#s2-plane", { x: 70, y: 176, rotation: -25 }, { x: 318, y: 58, rotation: -25, duration: 1.8, ease: "power1.inOut" }, 15.0);
          tl.fromTo("#s2-plane", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, 15.0);
          tl.to("#s2-plane", { x: 380, y: 30, duration: 0.6, ease: "power1.in" }, 16.8);
          tl.to("#s2-plane", { opacity: 0, duration: 0.6, ease: "power1.in" }, 16.8);
          tl.to("#s2-trail", { opacity: 0, duration: 0.8 }, 17.0);
          // 5 Herzen steigen vom Balkon auf
          $$(".s2-heart").forEach((h, i) => {
            const t = 17.6 + i * 0.25;
            tl.fromTo(h, { opacity: 0, y: 12, scale: 0.6 }, { opacity: 1, y: -10, scale: 1, duration: 0.6, ease: "back.out(2)", transformOrigin: "50% 100%" }, t);
            tl.to(h, { opacity: 0, y: -70, duration: 1.4, ease: "sine.in" }, t + 0.9);
          });

          // Ausblenden
          tl.to("#s2-list", { opacity: 0, y: -12, duration: 0.5, ease: "power2.in" }, 20.3);
          tl.to("#s2-art-inner", { opacity: 0, duration: 0.5, ease: "power2.in" }, 20.3);

          window.__timelines["s2-mehr-leben"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
