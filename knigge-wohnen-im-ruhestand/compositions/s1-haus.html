<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s1-haus-template">
      <style>
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #444f4f;
        }

        /* ---------- Layout 16:9 ---------- */
        .s1-art {
          position: absolute;
          right: 3cqw;
          bottom: 9cqh;
          width: 50cqw;
          aspect-ratio: 4 / 3;
        }
        .s1-art-inner {
          width: 100%;
          height: 100%;
        }
        .s1-art svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .s1-copy {
          position: absolute;
          left: 6.5cqw;
          top: 14cqh;
          bottom: 12cqh;
          width: 38cqw;
        }
        .s1-slot {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        /* ---------- Layout 9:16 ---------- */
        @container scene (orientation: portrait) {
          .s1-art {
            right: auto;
            left: 8cqw;
            bottom: auto;
            top: 40cqh;
            width: 84cqw;
          }
          .s1-copy {
            left: 8cqw;
            width: 84cqw;
            top: 15cqh;
            bottom: auto;
            height: 23cqh;
          }
          #root .s1-q {
            font-size: 6.3cqmin;
          }
          #root .s1-mem {
            font-size: 5.9cqmin;
          }
        }

        /* ---------- Typografie ---------- */
        .s1-serif {
          font-family: "Montserrat", sans-serif;
          font-weight: 400;
        }
        .s1-q {
          margin: 0;
          font-size: 5.6cqmin;
          line-height: 1.2;
          letter-spacing: -0.01em;
          color: #444f4f;
        }
        .s1-mem {
          margin: 0 0 1.4cqmin;
          font-size: 5.2cqmin;
          font-weight: 700;
          line-height: 1.2;
          letter-spacing: -0.02em;
          color: #444f4f;
        }
        .s1-sub {
          margin: 0 0 2cqmin;
          font-size: 4.4cqmin;
          font-weight: 400;
          line-height: 1.25;
          color: #5e6a6a;
        }
        .s1-big {
          margin: 0;
          font-size: 7.4cqmin;
          line-height: 1.1;
          letter-spacing: -0.02em;
          color: #444f4f;
        }
        .s1-red {
          color: #ca2c35;
        }
        .w {
          display: inline-block;
        }

        /* ---------- Lasten-Tags ---------- */
        .s1-tag-pos {
          position: absolute;
          transform: translate(-50%, -50%);
        }
        .s1-tag {
          display: block;
          white-space: nowrap;
          font-size: 3.3cqmin;
          font-weight: 700;
          color: #444f4f;
          background: #ffffff;
          border: 0.32cqmin solid #444f4f;
          border-radius: 0.9cqmin;
          padding: 0.8cqmin 2.3cqmin 0.9cqmin;
          box-shadow: 0 0.7cqmin 0 rgba(68, 79, 79, 0.14);
        }
        .s1-tag-red {
          color: #ffffff;
          background: #ca2c35;
          border-color: #6d131b;
        }

        /* ---------- Illustration ---------- */
        .ln {
          fill: none;
          stroke: #444f4f;
          stroke-width: 3.2;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 1 2;
          stroke-dashoffset: 1.05;
        }
        .ln.fl {
          fill-opacity: 0;
        }
        .ln.f-red {
          fill: #ca2c35;
        }
        .ln.f-deep {
          fill: #6d131b;
        }
        .ln.f-paper {
          fill: #ffffff;
        }
        .ln.f-sand {
          fill: #dfe3dd;
        }
        .ln.f-leaf {
          fill: #b9c2a0;
        }
        .s1-glass {
          fill: #aeb6bf;
          opacity: 0;
        }
        .s1-light {
          fill: #f2c36b;
          opacity: 0;
        }
        .s1-glow {
          fill: #f2c36b;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s1-haus" data-width="1920" data-height="1080" data-duration="18">
        <!-- Illustration: das Familienhaus -->
        <div class="s1-art">
          <div class="s1-art-inner" id="s1-art">
            <svg viewBox="0 0 800 600" aria-hidden="true">
              <defs>
                <radialGradient id="s1-halo-g">
                  <stop offset="0" stop-color="#f2c36b" stop-opacity="0.75" />
                  <stop offset="1" stop-color="#f2c36b" stop-opacity="0" />
                </radialGradient>
                <filter id="s1-blur" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="14" />
                </filter>
              </defs>

              <!-- Sonne -->
              <g id="s1-sun">
                <circle cx="668" cy="116" r="92" fill="url(#s1-halo-g)" />
                <circle cx="668" cy="116" r="36" fill="#f2c36b" stroke="#444f4f" stroke-width="3.2" />
              </g>

              <!-- Rauch -->
              <g fill="none" stroke="#8a9493" stroke-width="3.2" stroke-linecap="round">
                <path class="s1-smoke" d="M482 138 C472 120 494 106 484 88 C476 72 494 60 486 44" opacity="0" />
                <path class="s1-smoke" d="M492 138 C484 120 504 104 494 86 C486 70 504 58 496 42" opacity="0" />
                <path class="s1-smoke" d="M476 138 C466 122 488 108 478 90 C470 76 486 62 480 48" opacity="0" />
              </g>

              <!-- Baum mit Schaukel -->
              <g id="s1-tree">
                <path class="ln fl f-sand" pathLength="1" d="M104 520 C109 470 103 432 111 388 L127 388 C129 434 124 474 131 520 Z" />
                <path class="ln fl f-leaf" pathLength="1" d="M58 384 C28 374 26 324 56 310 C48 272 88 246 118 260 C138 234 184 248 184 284 C210 298 206 346 178 358 C184 386 152 402 130 392 C114 406 76 402 58 384 Z" />
                <path class="ln" pathLength="1" d="M124 424 C140 414 160 406 182 402" />
                <g id="s1-swing">
                  <path class="ln" pathLength="1" d="M152 410 V478 M176 404 V478" />
                  <path class="ln fl f-red" pathLength="1" d="M142 478 H186 V487 H142 Z" />
                </g>
              </g>

              <!-- Weg & Boden -->
              <path class="ln fl f-sand" pathLength="1" d="M352 520 L320 598 H440 L408 520" />
              <path class="ln" pathLength="1" d="M30 520 H770" />

              <!-- Haus -->
              <g id="s1-house">
                <path class="ln fl f-deep" pathLength="1" d="M462 146 H500 V250 H462 Z" />
                <path class="ln fl f-paper" pathLength="1" d="M206 270 H554 V520 H206 Z" />
                <path class="ln fl f-red" pathLength="1" d="M166 280 L380 106 L594 280 Z" />
                <path class="ln" pathLength="1" d="M206 280 H554" />

                <!-- Fenster: Glas (nachts), Licht, Schein, Rahmen -->
                <g class="s1-win" data-order="3">
                  <circle class="s1-glow" cx="380" cy="214" r="40" filter="url(#s1-blur)" />
                  <circle class="s1-glass" cx="380" cy="214" r="23" />
                  <circle class="s1-light" cx="380" cy="214" r="23" />
                  <path class="ln" pathLength="1" d="M357 214 A23 23 0 1 0 403 214 A23 23 0 1 0 357 214 Z M380 191 V237 M357 214 H403" />
                </g>
                <g class="s1-win" data-order="1">
                  <rect class="s1-glow" x="226" y="296" width="90" height="82" filter="url(#s1-blur)" />
                  <rect class="s1-glass" x="236" y="306" width="70" height="62" />
                  <rect class="s1-light" x="236" y="306" width="70" height="62" />
                  <path class="ln" pathLength="1" d="M236 306 H306 V368 H236 Z M271 306 V368 M236 337 H306" />
                </g>
                <g class="s1-win" data-order="2">
                  <rect class="s1-glow" x="335" y="296" width="90" height="82" filter="url(#s1-blur)" />
                  <rect class="s1-glass" x="345" y="306" width="70" height="62" />
                  <rect class="s1-light" x="345" y="306" width="70" height="62" />
                  <path class="ln" pathLength="1" d="M345 306 H415 V368 H345 Z M380 306 V368 M345 337 H415" />
                </g>
                <g class="s1-win" data-order="4">
                  <rect class="s1-glow" x="444" y="296" width="90" height="82" filter="url(#s1-blur)" />
                  <rect class="s1-glass" x="454" y="306" width="70" height="62" />
                  <rect class="s1-light" x="454" y="306" width="70" height="62" />
                  <path class="ln" pathLength="1" d="M454 306 H524 V368 H454 Z M489 306 V368 M454 337 H524" />
                </g>
                <g class="s1-win" data-order="0">
                  <rect class="s1-glow" x="226" y="404" width="104" height="90" filter="url(#s1-blur)" />
                  <rect class="s1-glass" x="236" y="414" width="84" height="70" />
                  <rect class="s1-light" x="236" y="414" width="84" height="70" />
                  <path class="ln" pathLength="1" d="M236 414 H320 V484 H236 Z M278 414 V484 M236 449 H320 M230 490 H326" />
                </g>
                <g class="s1-win" data-order="5">
                  <rect class="s1-glow" x="430" y="404" width="104" height="90" filter="url(#s1-blur)" />
                  <rect class="s1-glass" x="440" y="414" width="84" height="70" />
                  <rect class="s1-light" x="440" y="414" width="84" height="70" />
                  <path class="ln" pathLength="1" d="M440 414 H524 V484 H440 Z M482 414 V484 M440 449 H524 M434 490 H530" />
                </g>

                <!-- Tür -->
                <path class="ln fl f-deep" pathLength="1" d="M347 404 H413 V520 H347 Z" />
                <path class="ln" pathLength="1" d="M333 396 H427" />
                <circle id="s1-knob" cx="401" cy="466" r="4.5" fill="#f2c36b" opacity="0" />
              </g>

              <!-- Büsche -->
              <path class="ln fl f-leaf" pathLength="1" d="M196 520 C192 500 212 488 228 498 C238 484 262 490 262 508 C270 510 270 520 266 520 Z" />
              <path class="ln fl f-leaf" pathLength="1" d="M498 520 C494 502 512 490 528 500 C538 486 562 492 562 508 C572 510 572 520 566 520 Z" />

              <!-- Zaun -->
              <path class="ln" pathLength="1" d="M604 520 V480 L611 471 L618 480 V520 M626 520 V480 L633 471 L640 480 V520 M648 520 V480 L655 471 L662 480 V520 M670 520 V480 L677 471 L684 480 V520 M692 520 V480 L699 471 L706 480 V520 M714 520 V480 L721 471 L728 480 V520 M736 520 V480 L743 471 L750 480 V520" />
              <path class="ln" pathLength="1" d="M598 490 H756 M598 508 H756" />
            </svg>
          </div>

          <!-- Lasten-Tags (Positionen relativ zur Illustration) -->
          <div class="s1-tag-pos" data-layout-allow-overflow style="left: 31%; top: 46%"><span class="s1-tag" id="s1-tag-0">Treppen</span></div>
          <div class="s1-tag-pos" data-layout-allow-overflow style="left: 17%; top: 72%"><span class="s1-tag" id="s1-tag-1">Gartenarbeit</span></div>
          <div class="s1-tag-pos" data-layout-allow-overflow style="left: 64%; top: 22%"><span class="s1-tag" id="s1-tag-2">Heizkosten</span></div>
          <div class="s1-tag-pos" data-layout-allow-overflow style="left: 70%; top: 58%"><span class="s1-tag" id="s1-tag-3">Reparaturen</span></div>
          <div class="s1-tag-pos" data-layout-allow-overflow style="left: 47%; top: 90%"><span class="s1-tag s1-tag-red" id="s1-tag-4">Schnee schippen</span></div>
        </div>

        <!-- Text -->
        <div class="s1-copy">
          <div class="s1-slot" id="s1-t1">
            <p class="s1-q s1-serif" id="s1-q1">Erinnern Sie sich an den Tag, an dem Sie hier eingezogen sind?</p>
          </div>
          <div class="s1-slot" id="s1-t2">
            <p class="s1-mem" id="s1-m1">Kinderlachen im Flur.</p>
            <p class="s1-mem" id="s1-m2">Sommerfeste im Garten.</p>
            <p class="s1-mem" id="s1-m3">Ein Haus <span class="s1-red">voller Leben.</span></p>
          </div>
          <div class="s1-slot" id="s1-t3">
            <p class="s1-sub" id="s1-t3a">Die Kinder sind längst aus dem Haus.</p>
            <p class="s1-big s1-serif" id="s1-t3b">Es ist still geworden.</p>
          </div>
          <div class="s1-slot" id="s1-t4">
            <p class="s1-q s1-serif" id="s1-q4">Was früher Freude war, wird langsam <span class="s1-red">zur Last.</span></p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s1-haus"]');
          const $ = (s) => root.querySelector(s);
          const $$ = (s) => Array.from(root.querySelectorAll(s));

          // Wörter in inline-block-Spans zerlegen (deterministisch, ohne Messung)
          function splitWords(el) {
            Array.from(el.childNodes).forEach((node) => {
              if (node.nodeType === 3) {
                const parts = node.textContent.split(/(\s+)/);
                const frag = document.createDocumentFragment();
                parts.forEach((p) => {
                  if (!p) return;
                  if (/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p));
                  else {
                    const s = document.createElement("span");
                    s.className = "w";
                    s.textContent = p;
                    frag.appendChild(s);
                  }
                });
                node.replaceWith(frag);
              } else if (node.nodeType === 1) splitWords(node);
            });
            return Array.from(el.querySelectorAll(".w"));
          }

          const tl = gsap.timeline({ paused: true });
          const wordsIn = (words, t, step, dur) =>
            words.forEach((w, i) =>
              tl.fromTo(w, { opacity: 0, yPercent: 38 }, { opacity: 1, yPercent: 0, duration: dur, ease: "power3.out" }, t + i * step),
            );

          // ---------- Illustration zeichnet sich (svg-path-draw) ----------
          const lines = $$(".ln");
          lines.forEach((p, i) => {
            const inTree = p.closest("#s1-tree");
            const inHouse = p.closest("#s1-house");
            const base = inHouse ? 0.45 : inTree ? 0.35 : 0.2;
            tl.fromTo(p, { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, base + (i % 12) * 0.07);
          });
          tl.fromTo($$(".ln.fl"), { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.7, ease: "power1.out", stagger: 0.03 }, 1.3);
          tl.fromTo($$(".s1-glass"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.5);
          tl.fromTo("#s1-sun", { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 1.4, ease: "power2.out", svgOrigin: "668 116" }, 0.9);

          // ---------- Lichter gehen an (Leben) ----------
          const wins = $$(".s1-win").sort((a, b) => +a.dataset.order - +b.dataset.order);
          wins.forEach((w, i) => {
            const tOn = 2.4 + i * 0.28;
            tl.fromTo(w.querySelector(".s1-light"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, tOn);
            tl.fromTo(w.querySelector(".s1-glow"), { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power1.out" }, tOn);
          });
          tl.fromTo("#s1-knob", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.2);

          // Schaukel schwingt (sine-wave-loop, endlich) und kommt später zur Ruhe
          tl.fromTo("#s1-swing", { rotation: -7 }, { rotation: 7, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 5, svgOrigin: "164 405" }, 1.8);
          tl.to("#s1-swing", { rotation: 3, duration: 0.7, ease: "sine.inOut", svgOrigin: "164 405" }, 9.3);
          tl.to("#s1-swing", { rotation: -1, duration: 0.6, ease: "sine.inOut", svgOrigin: "164 405" }, 10.0);
          tl.to("#s1-swing", { rotation: 0, duration: 0.6, ease: "sine.out", svgOrigin: "164 405" }, 10.6);

          // Rauch aus dem Kamin (3 Schwaden, je 3 Zyklen)
          $$(".s1-smoke").forEach((s, i) => {
            for (let c = 0; c < 3; c++) {
              const t = 1.8 + i * 0.8 + c * 2.4;
              tl.fromTo(s, { opacity: 0, y: 0 }, { opacity: 0.75, y: -16, duration: 1.0, ease: "sine.out", immediateRender: false }, t);
              tl.to(s, { opacity: 0, y: -40, duration: 1.3, ease: "sine.in" }, t + 1.0);
            }
          });

          // ---------- Text Phase 1: Erinnerung ----------
          wordsIn(splitWords($("#s1-q1")), 0.45, 0.075, 0.7);
          tl.to("#s1-t1", { opacity: 0, y: -14, duration: 0.45, ease: "power2.in" }, 4.3);
          ["#s1-m1", "#s1-m2", "#s1-m3"].forEach((s, i) =>
            tl.fromTo($(s), { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 4.7 + i * 0.75),
          );
          tl.to("#s1-t2", { opacity: 0, y: -14, duration: 0.45, ease: "power2.in" }, 8.45);

          // ---------- Phase 2: Stille ----------
          tl.fromTo("#s1-t3a", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.25);
          wordsIn(splitWords($("#s1-t3b")), 10.1, 0.14, 0.9);
          wins
            .slice()
            .reverse()
            .forEach((w, i) => {
              const tOff = 9.6 + i * 0.26;
              tl.to(w.querySelector(".s1-light"), { opacity: 0, duration: 0.35, ease: "power1.in" }, tOff);
              tl.to(w.querySelector(".s1-glow"), { opacity: 0, duration: 0.45, ease: "power1.in" }, tOff);
            });
          tl.to("#s1-knob", { opacity: 0, duration: 0.4 }, 11.0);
          tl.to("#s1-sun", { opacity: 0.18, y: 70, duration: 2.2, ease: "sine.inOut", svgOrigin: "668 116" }, 9.4);
          tl.fromTo("#s1-art", { filter: "saturate(1) brightness(1)" }, { filter: "saturate(0.45) brightness(0.97)", duration: 2.2, ease: "sine.inOut" }, 9.4);

          // Lasten fallen aufs Haus; das Haus gibt jedes Mal ein wenig nach
          const rot = [-4, 3, -2, 4, -3];
          for (let k = 0; k < 5; k++) {
            const t = 11.8 + k * 0.5;
            tl.fromTo(
              "#s1-tag-" + k,
              { opacity: 0, y: -150, rotation: rot[k] - 12 },
              { opacity: 1, y: 0, rotation: rot[k], duration: 0.75, ease: "back.out(1.5)" },
              t,
            );
            const base = 1 - 0.005 * (k + 1);
            tl.to("#s1-house", { scaleY: base - 0.012, duration: 0.12, ease: "power2.out", svgOrigin: "380 520" }, t + 0.42);
            tl.to("#s1-house", { scaleY: base, duration: 0.35, ease: "sine.out", svgOrigin: "380 520" }, t + 0.54);
          }
          tl.to("#s1-t3", { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, 14.15);
          wordsIn(splitWords($("#s1-q4")), 14.55, 0.07, 0.75);

          // Übergabe an Szene 2: Tags weg, Haus richtet sich auf, Text blendet aus
          for (let k = 0; k < 5; k++) {
            tl.to("#s1-tag-" + k, { opacity: 0, y: 22, duration: 0.45, ease: "power2.in" }, 17.1 + k * 0.04);
          }
          tl.to("#s1-house", { scaleY: 1, duration: 0.6, ease: "sine.inOut", svgOrigin: "380 520" }, 17.1);
          tl.to("#s1-t4", { opacity: 0, y: -12, duration: 0.5, ease: "power2.in" }, 17.25);

          window.__timelines["s1-haus"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
